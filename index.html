<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室友煮飯採購與結算帳本</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_ROOMMATES = [
      { id: 'Janice', name: 'Janice', emoji: '👩🏻‍🍳' },
      { id: 'Carrie', name: 'Carrie', emoji: '👩🏼‍🌾' },
      { id: 'Kingsley', name: 'Kingsley', emoji: '👨🏻‍🍳' }
    ];

    // 生成過去 13 週 (約 3 個月) 的週選項
    function getPast13Weeks() {
      const weeks = [];
      const now = new Date();
      
      // 計算本週一
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const currentMonday = new Date(now);
      currentMonday.setDate(now.getDate() + diffToMonday);
      currentMonday.setHours(0,0,0,0);

      for (let i = 0; i < 13; i++) {
        const mon = new Date(currentMonday);
        mon.setDate(currentMonday.getDate() - (i * 7));
        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);

        const formatDate = (d) => `${d.getMonth()+1}/${d.getDate()}`;
        const key = mon.toISOString().split('T')[0];
        const label = i === 0 
          ? `本週 (${formatDate(mon)} - ${formatDate(sun)})`
          : `${i} 週前 (${formatDate(mon)} - ${formatDate(sun)})`;

        weeks.push({ key, label, startDate: mon, endDate: sun });
      }
      return weeks;
    }

    function App() {
      const weeksList = useMemo(() => getPast13Weeks(), []);
      const [selectedWeekKey, setSelectedWeekKey] = useState(weeksList[0].key);
      const [activeTab, setActiveTab] = useState('expenses'); // 'expenses', 'dinner', 'settlement'
      const [currentUser, setCurrentUser] = useState('Kingsley');

      // 資料狀態
      const [expenses, setExpenses] = useState([]);
      const [dinnerAbsent, setDinnerAbsent] = useState({}); // { '2026-09-08': ['Janice'] }
      const [settlements, setSettlements] = useState({}); // { weekKey: [ { id, from, to, amount, payerPaid, receiverConfirmed } ] }

      // 本機與全域雲端儲存同步 (以 cook_ledger_shared_data 為 Key)
      useEffect(() => {
        const saved = localStorage.getItem('cook_ledger_shared_data_v2');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.expenses) setExpenses(parsed.expenses);
            if (parsed.dinnerAbsent) setDinnerAbsent(parsed.dinnerAbsent);
            if (parsed.settlements) setSettlements(parsed.settlements);
          } catch(e) { console.error(e); }
        }
      }, []);

      const saveData = (newExpenses, newDinner, newSettlements) => {
        const payload = {
          expenses: newExpenses !== undefined ? newExpenses : expenses,
          dinnerAbsent: newDinner !== undefined ? newDinner : dinnerAbsent,
          settlements: newSettlements !== undefined ? newSettlements : settlements
        };
        localStorage.setItem('cook_ledger_shared_data_v2', JSON.stringify(payload));
      };

      // --- 新增採購項目 ---
      const [itemTitle, setItemTitle] = useState('');
      const [itemAmount, setItemAmount] = useState('');
      const [itemPayer, setItemPayer] = useState(currentUser);
      const [itemDate, setItemDate] = useState(new Date().toISOString().split('T')[0]);
      const [itemSplit, setItemSplit] = useState(['Janice', 'Carrie', 'Kingsley']);
      const [registeredBy, setRegisteredBy] = useState(currentUser);

      // 當切換 currentUser 時自動切換預設登記人與付款人
      useEffect(() => {
        setItemPayer(currentUser);
        setRegisteredBy(currentUser);
      }, [currentUser]);

      // 當選擇日期改變時，檢視當天「不回家吃」的紀錄並提醒
      useEffect(() => {
        const absentList = dinnerAbsent[itemDate] || [];
        if (absentList.length > 0) {
          setItemSplit(DEFAULT_ROOMMATES.map(r => r.id).filter(id => !absentList.includes(id)));
        } else {
          setItemSplit(['Janice', 'Carrie', 'Kingsley']);
        }
      }, [itemDate, dinnerAbsent]);

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!itemTitle || !itemAmount || parseFloat(itemAmount) <= 0 || itemSplit.length === 0) {
          alert('請填寫完整採購名稱、金額並至少選擇一位分攤人！');
          return;
        }

        const newEntry = {
          id: 'exp_' + Date.now(),
          title: itemTitle,
          amount: parseFloat(itemAmount),
          payer: itemPayer,
          date: itemDate,
          splitWith: itemSplit,
          registeredBy: registeredBy || currentUser,
          createdAt: new Date().toISOString()
        };

        const updated = [newEntry, ...expenses];
        setExpenses(updated);
        saveData(updated, undefined, undefined);

        setItemTitle('');
        setItemAmount('');
        alert('✅ 採購紀錄已成功新增！');
      };

      const handleDeleteExpense = (id) => {
        if (confirm('確定要刪除這筆採購紀錄嗎？')) {
          const updated = expenses.filter(e => e.id !== id);
          setExpenses(updated);
          saveData(updated, undefined, undefined);
        }
      };

      // --- 晚餐不回家吃登記 ---
      const toggleDinnerAbsent = (dateStr, personId) => {
        const currentList = dinnerAbsent[dateStr] || [];
        let updatedList = [];
        if (currentList.includes(personId)) {
          updatedList = currentList.filter(p => p !== personId);
        } else {
          updatedList = [...currentList, personId];
        }
        const updatedDinner = { ...dinnerAbsent, [dateStr]: updatedList };
        setDinnerAbsent(updatedDinner);
        saveData(undefined, updatedDinner, undefined);
      };

      // --- 篩選當週採購 ---
      const currentWeekObj = useMemo(() => {
        return weeksList.find(w => w.key === selectedWeekKey) || weeksList[0];
      }, [selectedWeekKey, weeksList]);

      const currentWeekExpenses = useMemo(() => {
        const start = new Date(currentWeekObj.startDate);
        const end = new Date(currentWeekObj.endDate);
        end.setHours(23, 59, 59, 999);

        return expenses.filter(exp => {
          const d = new Date(exp.date);
          return d >= start && d <= end;
        });
      }, [expenses, currentWeekObj]);

      // --- 計算本週結算金額 ---
      const weeklyCalculation = useMemo(() => {
        const paidMap = { Janice: 0, Carrie: 0, Kingsley: 0 };
        const oweMap = { Janice: 0, Carrie: 0, Kingsley: 0 };

        currentWeekExpenses.forEach(exp => {
          paidMap[exp.payer] += exp.amount;
          const share = exp.amount / exp.splitWith.length;
          exp.splitWith.forEach(person => {
            oweMap[person] += share;
          });
        });

        const netMap = {
          Janice: paidMap.Janice - oweMap.Janice,
          Carrie: paidMap.Carrie - oweMap.Carrie,
          Kingsley: paidMap.Kingsley - oweMap.Kingsley
        };

        // 計算最佳轉帳方案 (誰給誰多少錢)
        const creditors = []; // 應收款 (+)
        const debtors = [];   // 應付款 (-)

        Object.keys(netMap).forEach(person => {
          const val = Math.round(netMap[person] * 100) / 100;
          if (val > 0.01) creditors.push({ person, amount: val });
          else if (val < -0.01) debtors.push({ person, amount: -val });
        });

        const transfers = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const pay = Math.min(debtors[i].amount, creditors[j].amount);
          if (pay > 0.009) {
            transfers.push({
              id: `tr_${debtors[i].person}_${creditors[j].person}_${pay.toFixed(2)}`,
              from: debtors[i].person,
              to: creditors[j].person,
              amount: parseFloat(pay.toFixed(2))
            });
          }
          debtors[i].amount -= pay;
          creditors[j].amount -= pay;
          if (debtors[i].amount < 0.01) i++;
          if (creditors[j].amount < 0.01) j++;
        }

        return { paidMap, oweMap, netMap, transfers };
      }, [currentWeekExpenses]);

      // --- 確認消帳邏輯 ---
      const handleTogglePaymentStatus = (transferId, actionType) => {
        const weekSettles = settlements[selectedWeekKey] || {};
        const currentStatus = weekSettles[transferId] || { payerPaid: false, receiverConfirmed: false };

        let updatedStatus = { ...currentStatus };
        if (actionType === 'payer_pay') {
          updatedStatus.payerPaid = !updatedStatus.payerPaid;
        } else if (actionType === 'receiver_confirm') {
          updatedStatus.receiverConfirmed = !updatedStatus.receiverConfirmed;
        }

        const updatedWeekSettles = { ...weekSettles, [transferId]: updatedStatus };
        const updatedSettlements = { ...settlements, [selectedWeekKey]: updatedWeekSettles };

        setSettlements(updatedSettlements);
        saveData(undefined, undefined, updatedSettlements);
      };

      const getRoommateObj = (id) => DEFAULT_ROOMMATES.find(r => r.id === id) || { name: id, emoji: '👤' };

      return (
        <div className="max-w-3xl mx-auto p-4 pb-24">
          {/* 頂部 Header */}
          <header className="bg-white rounded-2xl p-5 shadow-sm mb-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border border-slate-200">
            <div>
              <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <span>🇬🇧</span> 室友買菜與煮飯帳本
              </h1>
              <p className="text-xs text-slate-500 mt-1">Janice • Carrie • Kingsley 專屬小額採購按週分攤</p>
            </div>

            {/* 當前使用者選擇器 */}
            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex items-center gap-2">
              <span className="text-xs font-semibold text-slate-600">👤 目前你是：</span>
              <div className="flex gap-1">
                {DEFAULT_ROOMMATES.map(r => (
                  <button
                    key={r.id}
                    onClick={() => setCurrentUser(r.id)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                      currentUser === r.id 
                        ? 'bg-emerald-600 text-white shadow-sm' 
                        : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                    }`}
                  >
                    {r.emoji} {r.name}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* 週選擇與導覽列 */}
          <div className="bg-white rounded-2xl p-4 shadow-sm mb-5 border border-slate-200">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-calendar-week text-emerald-600 text-lg"></i>
                <span className="font-bold text-slate-700">選擇計算週期：</span>
              </div>
              <select
                value={selectedWeekKey}
                onChange={(e) => setSelectedWeekKey(e.target.value)}
                className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
              >
                {weeksList.map(w => (
                  <option key={w.key} value={w.key}>{w.label}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Tab 頁籤切換 */}
          <div className="flex bg-slate-200/80 p-1 rounded-2xl mb-5 text-sm font-semibold">
            <button
              onClick={() => setActiveTab('expenses')}
              className={`flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-2 ${
                activeTab === 'expenses' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              <i className="fa-solid fa-cart-shopping"></i>
              採購明細
            </button>
            <button
              onClick={() => setActiveTab('dinner')}
              className={`flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-2 ${
                activeTab === 'dinner' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              <i className="fa-solid fa-utensils"></i>
              晚餐不回家吃登記
            </button>
            <button
              onClick={() => setActiveTab('settlement')}
              className={`flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-2 ${
                activeTab === 'settlement' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              <i className="fa-solid fa-calculator"></i>
              本週結算 & 消帳
            </button>
          </div>

          {/* TAB 1: 採購紀錄與新增 */}
          {activeTab === 'expenses' && (
            <div className="space-y-5">
              {/* 新增費用表單 */}
              <form onSubmit={handleAddExpense} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-plus-circle text-emerald-600"></i>
                  新增採購明細
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">物品/超市名稱</label>
                    <input
                      type="text"
                      placeholder="例：Sainsbury's 蔬菜雞胸肉"
                      value={itemTitle}
                      onChange={(e) => setItemTitle(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">總金額 (£ 英鎊)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="0.00"
                      value={itemAmount}
                      onChange={(e) => setItemAmount(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">採購日期</label>
                    <input
                      type="date"
                      value={itemDate}
                      onChange={(e) => setItemDate(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">先行先付人 (Payer)</label>
                    <select
                      value={itemPayer}
                      onChange={(e) => setItemPayer(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                      {DEFAULT_ROOMMATES.map(r => (
                        <option key={r.id} value={r.id}>{r.emoji} {r.name}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* 分攤成員 */}
                <div className="mt-4">
                  <label className="block text-xs font-semibold text-slate-600 mb-1.5">分攤成員 (預設 3 人均分)</label>
                  <div className="flex gap-3">
                    {DEFAULT_ROOMMATES.map(r => {
                      const isChecked = itemSplit.includes(r.id);
                      return (
                        <label
                          key={r.id}
                          className={`flex-1 flex items-center justify-center gap-2 p-2.5 rounded-xl cursor-pointer border transition text-sm font-medium ${
                            isChecked 
                              ? 'bg-emerald-50 border-emerald-500 text-emerald-800' 
                              : 'bg-slate-50 border-slate-200 text-slate-400'
                          }`}
                        >
                          <input
                            type="checkbox"
                            checked={isChecked}
                            onChange={() => {
                              if (isChecked) {
                                if (itemSplit.length === 1) return alert('至少需有一人分攤！');
                                setItemSplit(itemSplit.filter(id => id !== r.id));
                              } else {
                                setItemSplit([...itemSplit, r.id]);
                              }
                            }}
                            className="hidden"
                          />
                          <span>{r.emoji}</span>
                          <span>{r.name}</span>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {/* 登記人標示 */}
                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                  <span>📝 登記人：<strong className="text-slate-700">{getRoommateObj(registeredBy).emoji} {registeredBy}</strong></span>
                  <button
                    type="submit"
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-md transition flex items-center gap-2 text-sm"
                  >
                    <i className="fa-solid fa-check"></i>
                    確認新增
                  </button>
                </div>
              </form>

              {/* 明細列表 */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <i className="fa-solid fa-list-check text-emerald-600"></i>
                    當週採購紀錄 ({currentWeekExpenses.length} 筆)
                  </h3>
                  <span className="text-xs bg-slate-100 text-slate-600 font-semibold px-2.5 py-1 rounded-lg">
                    當週總額：£{currentWeekExpenses.reduce((sum, e) => sum + e.amount, 0).toFixed(2)}
                  </span>
                </div>

                {currentWeekExpenses.length === 0 ? (
                  <div className="text-center py-10 text-slate-400 text-sm">
                    <i className="fa-solid fa-basket-shopping text-3xl mb-2 block"></i>
                    本週尚無採購紀錄，點擊上方表單新增第一筆吧！
                  </div>
                ) : (
                  <div className="space-y-3">
                    {currentWeekExpenses.map(exp => (
                      <div key={exp.id} className="p-3.5 rounded-xl border border-slate-100 hover:border-slate-300 bg-slate-50/50 flex items-center justify-between transition">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-slate-800">{exp.title}</span>
                            <span className="text-emerald-700 font-extrabold text-base">£{exp.amount.toFixed(2)}</span>
                          </div>
                          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500 mt-1">
                            <span>📅 {exp.date}</span>
                            <span>💳 由 {getRoommateObj(exp.payer).emoji} {exp.payer} 付款</span>
                            <span>👥 分攤：{exp.splitWith.map(id => getRoommateObj(id).emoji).join(' ')}</span>
                            <span className="text-slate-400">📝 登記人：{getRoommateObj(exp.registeredBy || exp.payer).name}</span>
                          </div>
                        </div>

                        <button
                          onClick={() => handleDeleteExpense(exp.id)}
                          className="text-slate-300 hover:text-red-500 p-2 transition"
                          title="刪除此筆紀錄"
                        >
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 2: 晚餐不回家吃登記 */}
          {activeTab === 'dinner' && (
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <h2 className="text-base font-bold text-slate-800 mb-2 flex items-center gap-2">
                <i className="fa-solid fa-utensils text-emerald-600"></i>
                本週晚餐「不回家吃」登記表
              </h2>
              <p className="text-xs text-slate-500 mb-4">
                勾選「❌ 不回家吃」後，系統新增當天採購明細時會**自動將該室友排除分攤**！
              </p>

              <div className="space-y-3">
                {[0, 1, 2, 3, 4, 5, 6].map(offset => {
                  const dateObj = new Date(currentWeekObj.startDate);
                  dateObj.setDate(dateObj.getDate() + offset);
                  const dateStr = dateObj.toISOString().split('T')[0];
                  const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
                  const absentList = dinnerAbsent[dateStr] || [];

                  return (
                    <div key={dateStr} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-sm text-slate-700">{dateStr} ({dayNames[dateObj.getDay()]})</span>
                      </div>

                      <div className="flex gap-2">
                        {DEFAULT_ROOMMATES.map(r => {
                          const isAbsent = absentList.includes(r.id);
                          return (
                            <button
                              key={r.id}
                              onClick={() => toggleDinnerAbsent(dateStr, r.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border ${
                                isAbsent 
                                  ? 'bg-rose-100 text-rose-700 border-rose-300' 
                                  : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                              }`}
                            >
                              <span>{r.emoji}</span>
                              <span>{r.name}</span>
                              <span>{isAbsent ? '❌ 不回家吃' : '🍽️ 在家吃'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 3: 本週結算與消帳 */}
          {activeTab === 'settlement' && (
            <div className="space-y-5">
              {/* 三人收支摘要卡片 */}
              <div className="grid grid-cols-3 gap-3">
                {DEFAULT_ROOMMATES.map(r => {
                  const paid = weeklyCalculation.paidMap[r.id] || 0;
                  const owe = weeklyCalculation.oweMap[r.id] || 0;
                  const net = weeklyCalculation.netMap[r.id] || 0;

                  return (
                    <div key={r.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center">
                      <div className="text-2xl mb-1">{r.emoji}</div>
                      <div className="font-bold text-slate-800 text-sm">{r.name}</div>
                      <div className="text-xs text-slate-500 mt-1">實付: £{paid.toFixed(2)}</div>
                      <div className="text-xs text-slate-500">應付: £{owe.toFixed(2)}</div>
                      
                      <div className={`mt-2 pt-2 border-t text-sm font-extrabold ${
                        net > 0.009 ? 'text-emerald-600' : net < -0.009 ? 'text-rose-600' : 'text-slate-400'
                      }`}>
                        {net > 0.009 ? `+£${net.toFixed(2)}` : net < -0.009 ? `-£${Math.abs(net).toFixed(2)}` : '£0.00'}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 轉帳與雙方確認消帳清單 */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h3 className="font-bold text-slate-800 mb-3 flex items-center gap-2">
                  <i className="fa-solid fa-money-bill-transfer text-emerald-600"></i>
                  最佳化清算方案與雙方消帳確認
                </h3>

                {weeklyCalculation.transfers.length === 0 ? (
                  <div className="text-center py-8 text-emerald-600 font-medium text-sm">
                    🎉 本週帳目平衡，不需要進行任何轉帳！
                  </div>
                ) : (
                  <div className="space-y-4">
                    {weeklyCalculation.transfers.map(tr => {
                      const weekSettles = settlements[selectedWeekKey] || {};
                      const status = weekSettles[tr.id] || { payerPaid: false, receiverConfirmed: false };
                      const isCleared = status.payerPaid && status.receiverConfirmed;

                      const fromObj = getRoommateObj(tr.from);
                      const toObj = getRoommateObj(tr.to);

                      return (
                        <div key={tr.id} className={`p-4 rounded-xl border transition ${
                          isCleared ? 'bg-emerald-50/60 border-emerald-300' : 'bg-slate-50 border-slate-200'
                        }`}>
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                            <div className="flex items-center gap-2 font-bold text-slate-800 text-base">
                              <span>{fromObj.emoji} {fromObj.name}</span>
                              <i className="fa-solid fa-arrow-right text-slate-400 text-xs"></i>
                              <span>{toObj.emoji} {toObj.name}</span>
                              <span className="text-emerald-700 font-extrabold ml-1">£{tr.amount.toFixed(2)}</span>
                            </div>

                            {/* 狀態標籤 */}
                            <div>
                              {isCleared ? (
                                <span className="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                                  <i className="fa-solid fa-circle-check mr-1"></i> 已雙方消帳
                                </span>
                              ) : (
                                <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">
                                  ⏳ 待完成結算
                                </span>
                              )}
                            </div>
                          </div>

                          {/* 雙方確認按鈕區域 */}
                          <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60 text-xs">
                            {/* 付款方按鈕 */}
                            <button
                              onClick={() => handleTogglePaymentStatus(tr.id, 'payer_pay')}
                              className={`p-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition ${
                                status.payerPaid
                                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                                  : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100'
                              }`}
                            >
                              <i className={`fa-solid ${status.payerPaid ? 'fa-check' : 'fa-hand-holding-dollar'}`}></i>
                              <span>付款方 ({fromObj.name})：{status.payerPaid ? '已標記付款' : '點擊標記已付款'}</span>
                            </button>

                            {/* 收款方確認消帳按鈕 */}
                            <button
                              onClick={() => handleTogglePaymentStatus(tr.id, 'receiver_confirm')}
                              className={`p-2 rounded-lg font-semibold flex items-center justify-center gap-1.5 transition ${
                                status.receiverConfirmed
                                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                                  : status.payerPaid 
                                    ? 'bg-emerald-600 text-white shadow hover:bg-emerald-700' 
                                    : 'bg-white text-slate-400 border border-slate-200 cursor-not-allowed'
                              }`}
                            >
                              <i className={`fa-solid ${status.receiverConfirmed ? 'fa-circle-check' : 'fa-receipt'}`}></i>
                              <span>收款方 ({toObj.name})：{status.receiverConfirmed ? '已確認收款 (已消帳)' : '確認收到並消帳'}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
