<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>204室小帳本</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; }
    .cute-card { border-radius: 1.5rem; transition: transform 0.2s, box-shadow 0.2s; }
    .cute-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-rose-50/40 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 安全日期格式化工具 (避免 UTC 時區漂移) ---
    function formatLocalDate(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 採購類別標籤 (支援多選)
    const CATEGORIES = [
      { id: 'veg', name: '蔬菜水果', emoji: '🥦', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'meat', name: '肉類海鮮', emoji: '🥩', color: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'staple', name: '麵包主食', emoji: '🍞', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'drink', name: '飲料零食', emoji: '🧃', color: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'pantry', name: '日用調味', emoji: '🧴', color: 'bg-sky-100 text-sky-800 border-sky-300' },
      { id: 'other', name: '其他採購', emoji: '🛍️', color: 'bg-slate-100 text-slate-800 border-slate-300' }
    ];

    // 全分類 Emoji 清單
    const EMOJI_CATEGORIES = [
      { name: '表情角色', emojis: ['👩🏻‍🍳', '👩🏼‍🌾', '👨🏻‍🍳', '🤴🏻', '👸🏻', '🥷🏻', '🧙🏻‍♀️', '🧑‍🍳', '🕵🏻‍♂️', '💃🏻', '🕺🏻'] },
      { name: '可愛動物', emojis: ['🐱', '🐶', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐯', '🐸', '🐧', '🐥', '🦄', '🦦'] },
      { name: '美味食物', emojis: ['🥑', '🥦', '🥩', '🍞', '🥐', '🥞', '🍕', '🍔', '🍟', '🍣', '🍱', '🍦', '🍰', '🧋', '☕️', '🍓'] },
      { name: '生活日常', emojis: ['💖', '🌟', '🌸', '🧸', '🎮', '⚽️', '🏀', '🎨', '✈️', '🚀', '💡', '🎧', '🍷', '🍺'] }
    ];

    const INITIAL_ROOMMATES = [
      { id: 'Janice', name: 'Janice', emoji: '👩🏻‍🍳', googleEmail: null },
      { id: 'Carrie', name: 'Carrie', emoji: '👩🏼‍🌾', googleEmail: null },
      { id: 'Kingsley', name: 'Kingsley', emoji: '👨🏻‍🍳', googleEmail: null }
    ];

    // 永久固定儲存 Key
    const PERMANENT_STORAGE_KEY = 'ROOM204_PERMANENT_STORAGE_V2';

    // 精確生成過去 13 週 (約 3 個月) 週選項
    function getPast13Weeks(baseDate = new Date()) {
      const weeks = [];
      const now = new Date(baseDate);
      
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const currentMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);

      for (let i = 0; i < 13; i++) {
        const mon = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), currentMonday.getDate() - (i * 7));
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);

        const formatDateDisplay = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
        const key = formatLocalDate(mon);
        const label = i === 0 
          ? `本週 (${formatDateDisplay(mon)} - ${formatDateDisplay(sun)})`
          : `${i} 週前 (${formatDateDisplay(mon)} - ${formatDateDisplay(sun)})`;

        weeks.push({ key, label, startDate: mon, endDate: sun });
      }
      return weeks;
    }

    function App() {
      // 線上標準時間狀態
      const [currentNowDate, setCurrentNowDate] = useState(new Date());
      const [isNetworkTimeSynced, setIsNetworkTimeSynced] = useState(false);

      // 嘗試連線線上天文台/標準時間 API 校時
      useEffect(() => {
        fetch('https://worldtimeapi.org/api/timezone/Europe/London')
          .then(res => res.json())
          .then(data => {
            if (data && data.datetime) {
              const netDate = new Date(data.datetime);
              setCurrentNowDate(netDate);
              setIsNetworkTimeSynced(true);
            }
          })
          .catch(() => {
            console.log('網路時間取得失敗，使用裝置本地時間');
          });
      }, []);

      const weeksList = useMemo(() => getPast13Weeks(currentNowDate), [currentNowDate]);
      const [selectedWeekKey, setSelectedWeekKey] = useState(weeksList[0].key);
      const [activeTab, setActiveTab] = useState('expenses');
      
      // 室友與身分登入狀態
      const [roommates, setRoommates] = useState(INITIAL_ROOMMATES);
      const [loggedInUserEmail, setLoggedInUserEmail] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);

      const [showEmojiPickerFor, setShowEmojiPickerFor] = useState(null);
      const [customEmojiInput, setCustomEmojiInput] = useState('');

      // Modal 彈窗
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [backupJsonInput, setBackupJsonInput] = useState('');

      const [bindTarget, setBindTarget] = useState('Janice');
      const [loginEmailInput, setLoginEmailInput] = useState('');

      // 數據狀態
      const [expenses, setExpenses] = useState([]);
      const [dinnerAbsent, setDinnerAbsent] = useState({});
      const [settlements, setSettlements] = useState({});

      // 載入與自動遷移舊數據
      useEffect(() => {
        let loaded = localStorage.getItem(PERMANENT_STORAGE_KEY);
        
        if (!loaded) {
          const oldKeys = ['ROOM204_PERMANENT_STORAGE_V1', 'cook_ledger_shared_data_v5', 'cook_ledger_shared_data_v4'];
          for (const k of oldKeys) {
            const data = localStorage.getItem(k);
            if (data) { loaded = data; break; }
          }
        }

        if (loaded) {
          try {
            const parsed = JSON.parse(loaded);
            if (parsed.expenses) setExpenses(parsed.expenses);
            if (parsed.dinnerAbsent) setDinnerAbsent(parsed.dinnerAbsent);
            if (parsed.settlements) setSettlements(parsed.settlements);
            if (parsed.roommates) setRoommates(parsed.roommates);
            if (parsed.loggedInUserEmail) setLoggedInUserEmail(parsed.loggedInUserEmail);
          } catch(e) { console.error('Data loading error:', e); }
        }
      }, []);

      const saveData = (newExp, newDin, newSet, newRm, newEmail) => {
        const payload = {
          expenses: newExp !== undefined ? newExp : expenses,
          dinnerAbsent: newDin !== undefined ? newDin : dinnerAbsent,
          settlements: newSet !== undefined ? newSet : settlements,
          roommates: newRm !== undefined ? newRm : roommates,
          loggedInUserEmail: newEmail !== undefined ? newEmail : loggedInUserEmail
        };
        localStorage.setItem(PERMANENT_STORAGE_KEY, JSON.stringify(payload));
      };

      useEffect(() => {
        if (!loggedInUserEmail) {
          setCurrentUser(null);
          return;
        }
        const matched = roommates.find(r => r.googleEmail && r.googleEmail.toLowerCase() === loggedInUserEmail.toLowerCase());
        if (matched) {
          setCurrentUser(matched.id);
        } else {
          setCurrentUser(null);
        }
      }, [loggedInUserEmail, roommates]);

      const handleLoginAndBind = (email, roommateId) => {
        if (!email || !email.includes('@')) {
          alert('請輸入有效的 Google 電子郵件！');
          return;
        }

        const cleanEmail = email.trim().toLowerCase();
        
        const existing = roommates.find(r => r.googleEmail === cleanEmail && r.id !== roommateId);
        if (existing) {
          alert(`⚠️ 此 Google 帳號已被室友 【${existing.name}】 綁定，無法重複綁定！`);
          return;
        }

        const updatedRoommates = roommates.map(r => 
          r.id === roommateId ? { ...r, googleEmail: cleanEmail } : r
        );

        setRoommates(updatedRoommates);
        setLoggedInUserEmail(cleanEmail);
        saveData(undefined, undefined, undefined, updatedRoommates, cleanEmail);

        setShowLoginModal(false);
        setLoginEmailInput('');
        alert(`🎉 登入成功！已驗證為室友 【${roommateId}】`);
      };

      const handleLogout = () => {
        setLoggedInUserEmail(null);
        setCurrentUser(null);
        saveData(undefined, undefined, undefined, undefined, null);
      };

      const handleExportBackup = () => {
        const payload = { expenses, dinnerAbsent, settlements, roommates };
        const jsonStr = JSON.stringify(payload, null, 2);
        navigator.clipboard.writeText(jsonStr);
        alert('📋 數據已成功複製到剪貼簿！可將此備份文字妥善保存。');
      };

      const handleImportBackup = () => {
        if (!backupJsonInput) return;
        try {
          const parsed = JSON.parse(backupJsonInput);
          if (parsed.expenses) setExpenses(parsed.expenses);
          if (parsed.dinnerAbsent) setDinnerAbsent(parsed.dinnerAbsent);
          if (parsed.settlements) setSettlements(parsed.settlements);
          if (parsed.roommates) setRoommates(parsed.roommates);

          saveData(parsed.expenses, parsed.dinnerAbsent, parsed.settlements, parsed.roommates, undefined);
          setShowBackupModal(false);
          setBackupJsonInput('');
          alert('✅ 備份數據已成功匯入與恢復！');
        } catch(e) {
          alert('❌ 備份格式錯誤，請確認貼上的是正確的 JSON 數據。');
        }
      };

      const handleUpdateEmoji = (personId, newEmoji) => {
        if (!newEmoji) return;
        const updated = roommates.map(r => r.id === personId ? { ...r, emoji: newEmoji } : r);
        setRoommates(updated);
        saveData(undefined, undefined, undefined, updated, undefined);
        setShowEmojiPickerFor(null);
        setCustomEmojiInput('');
      };

      // --- 新增採購項目 ---
      const [itemTitle, setItemTitle] = useState('');
      const [itemAmount, setItemAmount] = useState('');
      const [itemCategories, setItemCategories] = useState(['veg']);
      const [itemDate, setItemDate] = useState(formatLocalDate(currentNowDate));
      const [itemSplit, setItemSplit] = useState(['Janice', 'Carrie', 'Kingsley']);

      const toggleCategoryTag = (catId) => {
        if (itemCategories.includes(catId)) {
          if (itemCategories.length === 1) return alert('至少需選擇一個採購分類！');
          setItemCategories(itemCategories.filter(id => id !== catId));
        } else {
          setItemCategories([...itemCategories, catId]);
        }
      };

      useEffect(() => {
        const absentList = dinnerAbsent[itemDate] || [];
        if (absentList.length > 0) {
          setItemSplit(roommates.map(r => r.id).filter(id => !absentList.includes(id)));
        } else {
          setItemSplit(roommates.map(r => r.id));
        }
      }, [itemDate, dinnerAbsent, roommates]);

      const handleAddExpense = (e) => {
        e.preventDefault();

        if (!currentUser) {
          alert('🔒 權限限制：請先登入 Google 帳號並驗證身份後再進行操作！');
          return;
        }

        if (!itemTitle || !itemAmount || parseFloat(itemAmount) <= 0 || itemSplit.length === 0) {
          alert('請填寫物品名稱、金額，並選擇至少一位分攤成員！');
          return;
        }

        const newEntry = {
          id: 'exp_' + Date.now(),
          title: itemTitle,
          amount: parseFloat(itemAmount),
          categories: itemCategories,
          payer: currentUser,
          date: itemDate,
          splitWith: itemSplit,
          registeredBy: currentUser,
          registeredEmail: loggedInUserEmail,
          createdAt: new Date().toISOString()
        };

        const updated = [newEntry, ...expenses];
        setExpenses(updated);
        saveData(updated, undefined, undefined, undefined, undefined);

        setItemTitle('');
        setItemAmount('');
        alert('✨ 成功加入採購明細！');
      };

      const handleDeleteExpense = (exp) => {
        if (!currentUser) {
          alert('🔒 請先登入 Google 帳號！');
          return;
        }

        if (exp.registeredBy !== currentUser) {
          alert(`🔒 權限限制：此筆採購是由 ${exp.registeredBy} 登記的，只有登記本人才可以刪除喔！`);
          return;
        }

        if (confirm(`確定要刪除「${exp.title}」這筆紀錄嗎？`)) {
          const updated = expenses.filter(e => e.id !== exp.id);
          setExpenses(updated);
          saveData(updated, undefined, undefined, undefined, undefined);
        }
      };

      const toggleDinnerAbsent = (dateStr, personId) => {
        if (!currentUser) {
          alert('🔒 請先登入 Google 帳號！');
          return;
        }

        if (currentUser !== personId) {
          alert(`🔒 權限限制：您目前是 ${currentUser}，只能修改自己當天「回家吃 / 不回家吃」的狀態喔！`);
          return;
        }

        const currentList = dinnerAbsent[dateStr] || [];
        const updatedList = currentList.includes(personId)
          ? currentList.filter(p => p !== personId)
          : [...currentList, personId];

        const updatedDinner = { ...dinnerAbsent, [dateStr]: updatedList };
        setDinnerAbsent(updatedDinner);
        saveData(undefined, updatedDinner, undefined, undefined, undefined);
      };

      // 週計算
      const currentWeekObj = useMemo(() => {
        return weeksList.find(w => w.key === selectedWeekKey) || weeksList[0];
      }, [selectedWeekKey, weeksList]);

      const currentWeekExpenses = useMemo(() => {
        const start = new Date(currentWeekObj.startDate);
        start.setHours(0,0,0,0);
        const end = new Date(currentWeekObj.endDate);
        end.setHours(23, 59, 59, 999);

        return expenses.filter(exp => {
          const parts = exp.date.split('-');
          const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
          return d >= start && d <= end;
        });
      }, [expenses, currentWeekObj]);

      const weeklyCalculation = useMemo(() => {
        const paidMap = { Janice: 0, Carrie: 0, Kingsley: 0 };
        const oweMap = { Janice: 0, Carrie: 0, Kingsley: 0 };

        currentWeekExpenses.forEach(exp => {
          paidMap[exp.payer] = (paidMap[exp.payer] || 0) + exp.amount;
          const share = exp.amount / exp.splitWith.length;
          exp.splitWith.forEach(person => {
            oweMap[person] = (oweMap[person] || 0) + share;
          });
        });

        const netMap = {
          Janice: (paidMap.Janice || 0) - (oweMap.Janice || 0),
          Carrie: (paidMap.Carrie || 0) - (oweMap.Carrie || 0),
          Kingsley: (paidMap.Kingsley || 0) - (oweMap.Kingsley || 0)
        };

        const creditors = [];
        const debtors = [];

        Object.keys(netMap).forEach(person => {
          const val = Math.round(netMap[person] * 100) / 100;
          if (val > 0.01) creditors.push({ person, amount: val });
          else if (val < -0.01) debtors.push({ person, amount: -val });
        });

        const transfers = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const pay = Math.min(debtors[i].amount, creditors[j].amount);
          if (pay > 0.009) {
            transfers.push({
              id: `tr_${debtors[i].person}_${creditors[j].person}_${pay.toFixed(2)}`,
              from: debtors[i].person,
              to: creditors[j].person,
              amount: parseFloat(pay.toFixed(2))
            });
          }
          debtors[i].amount -= pay;
          creditors[j].amount -= pay;
          if (debtors[i].amount < 0.01) i++;
          if (creditors[j].amount < 0.01) j++;
        }

        return { paidMap, oweMap, netMap, transfers };
      }, [currentWeekExpenses]);

      const handleTogglePaymentStatus = (tr, actionType) => {
        if (!currentUser) {
          alert('🔒 請先登入 Google 帳號！');
          return;
        }

        if (actionType === 'payer_pay' && currentUser !== tr.from) {
          alert(`🔒 權限限制：此筆款項的付款方是 ${tr.from}，只能由 ${tr.from} 本人點擊標記付款！`);
          return;
        }

        if (actionType === 'receiver_confirm' && currentUser !== tr.to) {
          alert(`🔒 權限限制：此筆款項的收款方是 ${tr.to}，只能由 ${tr.to} 本人點擊確認消帳！`);
          return;
        }

        const weekSettles = settlements[selectedWeekKey] || {};
        const currentStatus = weekSettles[tr.id] || { payerPaid: false, receiverConfirmed: false };

        let updatedStatus = { ...currentStatus };
        if (actionType === 'payer_pay') {
          updatedStatus.payerPaid = !updatedStatus.payerPaid;
        } else if (actionType === 'receiver_confirm') {
          updatedStatus.receiverConfirmed = !updatedStatus.receiverConfirmed;
        }

        const updatedWeekSettles = { ...weekSettles, [tr.id]: updatedStatus };
        const updatedSettlements = { ...settlements, [selectedWeekKey]: updatedWeekSettles };

        setSettlements(updatedSettlements);
        saveData(undefined, undefined, updatedSettlements, undefined, undefined);
      };

      const getRoommateObj = (id) => roommates.find(r => r.id === id) || { name: id, emoji: '👤' };
      const getCategoryObj = (catId) => CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];

      const currentRmUserObj = currentUser ? getRoommateObj(currentUser) : null;

      return (
        <div className="max-w-3xl mx-auto p-4 pb-24">
          {/* Header：204室小帳本 */}
          <header className="bg-white rounded-3xl p-6 shadow-sm mb-5 border-2 border-rose-100 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-3xl">🏠</span>
                <h1 className="text-2xl font-bold text-slate-800 tracking-tight">204室小帳本</h1>
                {isNetworkTimeSynced && (
                  <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full" title="線上天文台校準時間">
                    🌐 網絡校時已連線
                  </span>
                )}
              </div>
              <p className="text-xs text-rose-500 font-medium mt-1">Janice • Carrie • Kingsley 買菜與晚餐記錄小幫手</p>
            </div>

            {/* Google 帳號與備份 */}
            <div className="flex flex-col gap-2 items-start md:items-end">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowBackupModal(true)}
                  className="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold px-3 py-1.5 rounded-full text-xs transition flex items-center gap-1.5"
                  title="數據備份與匯入"
                >
                  <i className="fa-solid fa-database"></i>
                  <span>數據備份</span>
                </button>

                {currentUser ? (
                  <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs px-3.5 py-1.5 rounded-full flex items-center gap-2 font-bold shadow-sm">
                    <span className="text-base">{currentRmUserObj.emoji}</span>
                    <span>{currentUser} ({loggedInUserEmail})</span>
                    <button onClick={handleLogout} className="text-slate-400 hover:text-rose-600 ml-1" title="登出">
                      <i className="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowLoginModal(true)}
                    className="bg-rose-500 hover:bg-rose-600 text-white font-bold px-4 py-1.5 rounded-full text-xs flex items-center gap-2 shadow-md transition"
                  >
                    <i className="fa-brands fa-google"></i>
                    <span>登入 Google 驗證身份</span>
                  </button>
                )}
              </div>

              {/* 室友身分說明 */}
              <div className="bg-amber-50/80 px-3 py-1.5 rounded-2xl border border-amber-200 flex items-center gap-2 text-xs">
                <span className="font-bold text-amber-800">👤 目前身份：</span>
                {currentUser ? (
                  <span className="font-bold text-emerald-700">🔒 已鎖定為 {currentRmUserObj.emoji} {currentUser}</span>
                ) : (
                  <span className="text-rose-600 font-bold">🔒 未登入 (唯讀模式)</span>
                )}
              </div>
            </div>
          </header>

          {/* 未登入警告 Banner */}
          {!currentUser && (
            <div className="bg-amber-100/80 border-2 border-amber-300 rounded-3xl p-4 mb-5 flex items-center justify-between text-xs font-bold text-amber-900 shadow-sm">
              <div className="flex items-center gap-2">
                <span className="text-xl">🔒</span>
                <span>您目前尚未登入 Google 帳號！您可以查看歷史帳目，但**需登入後方可新增費用、登記晚餐或進行付款消帳**。</span>
              </div>
              <button
                onClick={() => setShowLoginModal(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-1.5 rounded-2xl shrink-0 font-bold ml-2 shadow transition"
              >
                區域登入
              </button>
            </div>
          )}

          {/* 全 Emoji 個人頭像選單 */}
          <div className="bg-white rounded-3xl p-4 shadow-sm mb-5 border-2 border-rose-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div className="flex items-center gap-2 text-xs font-bold text-slate-700">

                            bindTarget === r.id
                              ? 'bg-rose-50 border-rose-500 text-rose-700'
                              : 'bg-slate-50 border-slate-200 text-slate-600'
                          }`}
                        >
                          <span className="text-lg">{r.emoji}</span>
                          <span>{r.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Google 電子郵件 (Email)：</label>
                    <input
                      type="email"
                      placeholder="your-name@gmail.com"
                      value={loginEmailInput}
                      onChange={(e) => setLoginEmailInput(e.target.value)}
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3.5 py-2 text-sm focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <button
                    onClick={() => handleLoginAndBind(loginEmailInput, bindTarget)}
                    className="w-full bg-rose-500 text-white font-bold py-2.5 rounded-2xl shadow-md hover:bg-rose-600 transition text-xs"
                  >
                    驗證並綁定登入
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 數據備份 Modal */}
          {showBackupModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-2 border-rose-100 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <i className="fa-solid fa-database text-rose-500"></i>
                    數據備份與匯入
                  </h3>
                  <button onClick={() => setShowBackupModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-3">
                  <button
                    onClick={handleExportBackup}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-2xl shadow transition text-xs flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-copy"></i>
                    一鍵複製現有帳本備份 (Copy JSON)
                  </button>

                  <div className="pt-2 border-t border-slate-200">
                    <label className="block text-xs font-bold text-slate-600 mb-1">匯入舊數據備份 (貼上 JSON)：</label>
                    <textarea
                      rows="4"
                      value={backupJsonInput}
                      onChange={(e) => setBackupJsonInput(e.target.value)}
                      placeholder='貼上包含 {"expenses": [...]} 的備份文字'
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-2.5 text-xs font-mono focus:outline-none focus:border-rose-400"
                    ></textarea>
                    <button
                      onClick={handleImportBackup}
                      className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 rounded-2xl shadow transition text-xs mt-2"
                    >
                      確認匯入數據
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
