    const LEDGER_START_DATE = new Date(2026, 8, 7); // 帳本從這週開始記錄 (2026-09-07)

    function getRecentWeeks(baseDate = new Date()) {
      const weeks = [];
      const now = new Date(baseDate);
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const currentMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);

      for (let i = 0; i < MAX_WEEKS_HISTORY; i++) {
        const mon = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), currentMonday.getDate() - (i * 7));
        if (mon < LEDGER_START_DATE) break;

        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);

        const formatDateDisplay = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
        const key = formatLocalDate(mon);
        const label = i === 0
          ? `本週 (${formatDateDisplay(mon)} - ${formatDateDisplay(sun)})`
          : `${i} 週前 (${formatDateDisplay(mon)} - ${formatDateDisplay(sun)})`;

        weeks.push({ key, label, startDate: mon, endDate: sun });
      }

      if (weeks.length === 0) {
        const sun = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), currentMonday.getDate() + 6);
        const formatDateDisplay = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
        weeks.push({
          key: formatLocalDate(currentMonday),
          label: `本週 (${formatDateDisplay(currentMonday)} - ${formatDateDisplay(sun)})`,
          startDate: currentMonday,
          endDate: sun
        });
      }

      return weeks;
    }

    // 通用「誰付了多少、應付多少、互相要轉多少錢」計算 (週採購 / 月帳單共用)
    function calculateTransfers(items, roommates) {
      const paidMap = {};
      const oweMap = {};
      roommates.forEach(r => { paidMap[r.id] = 0; oweMap[r.id] = 0; });

      items.forEach(item => {
        paidMap[item.payer] = (paidMap[item.payer] || 0) + item.amount;
        const share = item.amount / item.splitWith.length;
        item.splitWith.forEach(person => {
          oweMap[person] = (oweMap[person] || 0) + share;
        });
      });

      const netMap = {};
      roommates.forEach(r => { netMap[r.id] = (paidMap[r.id] || 0) - (oweMap[r.id] || 0); });

      const creditors = [];
      const debtors = [];

      Object.keys(netMap).forEach(person => {
        const val = Math.round(netMap[person] * 100) / 100;
        if (val > 0.01) creditors.push({ person, amount: val });
        else if (val < -0.01) debtors.push({ person, amount: -val });
      });

      const transfers = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amount, creditors[j].amount);
        if (pay > 0.009) {
          transfers.push({
            id: `tr_${debtors[i].person}_${creditors[j].person}_${pay.toFixed(2)}`,
            from: debtors[i].person,
            to: creditors[j].person,
            amount: parseFloat(pay.toFixed(2))
          });
        }
        debtors[i].amount -= pay;
        creditors[j].amount -= pay;
        if (debtors[i].amount < 0.01) i++;
        if (creditors[j].amount < 0.01) j++;
      }

      return { paidMap, oweMap, netMap, transfers };
    }

    // 產生所有室友兩兩配對的 key（例如 "Carrie<Janice"，字母序排列，方向固定不變）
    function getPairKeys(roommates) {
      const ids = roommates.map(r => r.id);
      const pairs = [];
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          pairs.push(`${ids[i]}<${ids[j]}`);
        }
      }
      return pairs;
    }

    // 計算某一組室友配對「目前實際結清後」的淨額（正數代表 a 欠 b；負數代表 b 欠 a）
    // 這個數字只跟這兩人之間的採購/帳單有關，不受第三人金額變動影響，也不受已確認付款以外的操作影響，所以不會有「已消帳卻又疊加」的問題
    function getPairSignedBalance(pairKey, items, payments) {
      const [a, b] = pairKey.split('<');
      let signed = 0;

      items.forEach(item => {
        const share = item.amount / item.splitWith.length;
        item.splitWith.forEach(person => {
          if (person === item.payer) return;
          if (person === a && item.payer === b) signed += share;
          else if (person === b && item.payer === a) signed -= share;
        });
      });

      payments.forEach(p => {
        if (!p.receiverConfirmed) return;
        if (p.from === a && p.to === b) signed -= p.amount;
        else if (p.from === b && p.to === a) signed += p.amount;
      });

      return Math.round(signed * 100) / 100;
    }

    // 組出這個週期 (週採購 / 月帳單) 裡每一組室友配對的「剩餘應付」與付款紀錄，供摺疊卡片顯示
    function buildSettlementPairs(items, payments, roommates) {
      return getPairKeys(roommates).map(pairKey => {
        const [a, b] = pairKey.split('<');
        const signed = getPairSignedBalance(pairKey, items, payments);
        const pairPayments = payments
          .filter(p => p.pairKey === pairKey)
          .slice()
          .sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt));
        const pendingTotal = Math.round(
          pairPayments.filter(p => p.payerPaid && !p.receiverConfirmed).reduce((sum, p) => sum + p.amount, 0) * 100
        ) / 100;

        return {
          pairKey,
          from: signed >= 0 ? a : b,
          to: signed >= 0 ? b : a,
          remaining: Math.abs(signed),
          pendingTotal,
          payments: pairPayments
        };
      }).filter(p => p.remaining > 0.009 || p.pendingTotal > 0.009 || p.payments.length > 0);
    }

    const MAX_MONTHS_HISTORY = 12; // 最多保留 12 個月的帳單紀錄

    const FIXED_BILL_PAYERS = {

    function getRecentMonths(baseDate = new Date()) {
      const months = [];
      const now = new Date(baseDate);
      const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const ledgerStartMonth = new Date(LEDGER_START_DATE.getFullYear(), LEDGER_START_DATE.getMonth(), 1);

      for (let i = 0; i < MAX_MONTHS_HISTORY; i++) {
        const m = new Date(currentMonthStart.getFullYear(), currentMonthStart.getMonth() - i, 1);
        if (m < ledgerStartMonth) break;

        const key = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`;
        const label = i === 0
          ? `本月 (${m.getFullYear()}/${m.getMonth() + 1})`
          : `${m.getFullYear()}/${m.getMonth() + 1}`;

        months.push({ key, label, year: m.getFullYear(), month: m.getMonth() });
      }

      if (months.length === 0) {
        months.push({
          key: `${currentMonthStart.getFullYear()}-${String(currentMonthStart.getMonth() + 1).padStart(2, '0')}`,
          label: `本月 (${currentMonthStart.getFullYear()}/${currentMonthStart.getMonth() + 1})`,
          year: currentMonthStart.getFullYear(),
          month: currentMonthStart.getMonth()
        });
      }

      return months;
    }

    function App() {
      const [currentNowDate] = useState(new Date());
      const [syncStatus, setSyncStatus] = useState('syncing'); // 'online' | 'syncing' | 'error'

      const weeksList = useMemo(() => getRecentWeeks(currentNowDate), [currentNowDate]);
      const [selectedWeekKey, setSelectedWeekKey] = useState(weeksList[0].key);

      const monthsList = useMemo(() => getRecentMonths(currentNowDate), [currentNowDate]);
      const [selectedMonthKey, setSelectedMonthKey] = useState(monthsList[0].key);

      const [activeTab, setActiveTab] = useState('expenses');

      const [bills, setBills] = useState([]);
      const [billSettlements, setBillSettlements] = useState({});
      const [billType, setBillType] = useState('electricity');
      const [billAmount, setBillAmount] = useState('');
      const [billSplit, setBillSplit] = useState(['Janice', 'Carrie', 'Kingsley']);

      const [showUnsettledModal, setShowUnsettledModal] = useState(false);
      const [unsettledItems, setUnsettledItems] = useState([]);
      const unsettledCheckedForRef = React.useRef(null);

      const [expandedWeekPairs, setExpandedWeekPairs] = useState({});
      const [weekPayAmountInputs, setWeekPayAmountInputs] = useState({});
      const [expandedMonthPairs, setExpandedMonthPairs] = useState({});
      const [monthPayAmountInputs, setMonthPayAmountInputs] = useState({});

      const [showRentReminderModal, setShowRentReminderModal] = useState(false);

      const [roommates, setRoommates] = useState(INITIAL_ROOMMATES);
      const [currentUser, setCurrentUser] = useState(null);

      const [showEmojiPickerFor, setShowEmojiPickerFor] = useState(null);
      const [customEmojiInput, setCustomEmojiInput] = useState('');

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [backupJsonInput, setBackupJsonInput] = useState('');

      const [bindTarget, setBindTarget] = useState('Janice');
      const [pinInput, setPinInput] = useState('');

      const [showChangePinModal, setShowChangePinModal] = useState(false);
      const [oldPinInput, setOldPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [newPinConfirmInput, setNewPinConfirmInput] = useState('');

      const [expenses, setExpenses] = useState([]);
      const [dinnerAbsent, setDinnerAbsent] = useState({});
      const [settlements, setSettlements] = useState({});

      const applyIncomingData = (data) => {
        if (!data) return;
        if (data.expenses) setExpenses(data.expenses);
        if (data.dinnerAbsent) setDinnerAbsent(data.dinnerAbsent);
        if (data.settlements) setSettlements(data.settlements);
        if (data.roommates) setRoommates(data.roommates);
        if (data.bills) setBills(data.bills);
        if (data.billSettlements) setBillSettlements(data.billSettlements);
        setLastSyncTime(new Date().toLocaleTimeString());
        localStorage.setItem(PERMANENT_STORAGE_KEY, JSON.stringify(data));
      };

      // 載入 Supabase 資料與設定 WebSocket 實時監聽
      useEffect(() => {
        const localData = localStorage.getItem(PERMANENT_STORAGE_KEY);
        if (localData) {
          try {
            const parsed = JSON.parse(localData);
            applyIncomingData(parsed);
          } catch(e) {}
        }

        if (!supabase) {
          setSyncStatus('error');
          return;
        }

        // 1. 首刷數據
        const fetchInitialData = async () => {
          setSyncStatus('syncing');
          try {
            const { data, error } = await supabase
              .from('cook_ledger')
              .select('data')
              .eq('id', DB_ROW_ID)
              .single();

            if (data && data.data) {
              applyIncomingData(data.data);
              setSyncStatus('online');
            } else if (error && error.code === 'PGRST116') {
              // 代表該 row 尚未建立，建立預設 row
              const initPayload = { expenses: [], dinnerAbsent: {}, settlements: {}, roommates: INITIAL_ROOMMATES, bills: [], billSettlements: {} };
              await supabase.from('cook_ledger').insert([{ id: DB_ROW_ID, data: initPayload }]);
              setSyncStatus('online');
            }
          } catch (e) {
            setSyncStatus('error');
          }
        };

        fetchInitialData();

        // 2. 開啟 Supabase Realtime WebSocket 廣播監聽
        const channel = supabase
          .channel('public:cook_ledger')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cook_ledger' }, (payload) => {
            if (payload.new && payload.new.data) {
              applyIncomingData(payload.new.data);
              setSyncStatus('online');
            }
          })
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') setSyncStatus('online');
          });

        return () => {
          supabase.removeChannel(channel);
        };
      }, []);

      // 還原此裝置上次登入的身份（僅存於本機瀏覽器，不會同步給其他人）
      useEffect(() => {
        const savedUser = localStorage.getItem(CURRENT_USER_STORAGE_KEY);
        if (savedUser) setCurrentUser(savedUser);
      }, []);

      // 推送寫入 Supabase
      const saveData = async (newExp, newDin, newSet, newRm, newBills, newBillSet) => {
        const payload = {
          expenses: newExp !== undefined ? newExp : expenses,
          dinnerAbsent: newDin !== undefined ? newDin : dinnerAbsent,
          settlements: newSet !== undefined ? newSet : settlements,
          roommates: newRm !== undefined ? newRm : roommates,
          bills: newBills !== undefined ? newBills : bills,
          billSettlements: newBillSet !== undefined ? newBillSet : billSettlements
        };

        localStorage.setItem(PERMANENT_STORAGE_KEY, JSON.stringify(payload));

        if (!supabase) return;
        setSyncStatus('syncing');

        try {
          const { error } = await supabase
            .from('cook_ledger')
            .upsert({ id: DB_ROW_ID, data: payload, updated_at: new Date().toISOString() });

          if (!error) {
            setSyncStatus('online');
            setLastSyncTime(new Date().toLocaleTimeString());
          } else {
            setSyncStatus('error');
          }
        } catch (e) {
          setSyncStatus('error');
        }
      };

      const handlePinLogin = () => {
        const target = roommates.find(r => r.id === bindTarget);
        if (!target) return;

        if (!/^\d{4,6}$/.test(pinInput)) {
          alert('請輸入 4-6 位數字的 PIN 碼！');
          return;

        if (target.pin) {
          if (pinInput !== target.pin) {
            alert('❌ PIN 碼錯誤，請再試一次！');
            return;

          const duplicate = roommates.find(r => r.id !== target.id && r.pin === pinInput);
          if (duplicate) {
            alert(`⚠️ 這組 PIN 碼已經被 ${duplicate.name} 使用，請換一組不同的 PIN 碼！`);
            return;
          }

          const updatedRoommates = roommates.map(r =>
            r.id === target.id ? { ...r, pin: pinInput } : r
          );
          setRoommates(updatedRoommates);
          saveData(undefined, undefined, undefined, updatedRoommates);
        }

        setCurrentUser(target.id);
        localStorage.setItem(CURRENT_USER_STORAGE_KEY, target.id);
        setShowLoginModal(false);
        setPinInput('');
      };

      const handleResetPin = (roommateId) => {
        const target = roommates.find(r => r.id === roommateId);
        if (!target) return;
        if (!confirm(`確定要重設 ${target.name} 的 PIN 碼嗎？重設後需要立刻設定一組新的 PIN。`)) return;

        const updatedRoommates = roommates.map(r => r.id === roommateId ? { ...r, pin: null } : r);
        setRoommates(updatedRoommates);
        saveData(undefined, undefined, undefined, updatedRoommates);
        setPinInput('');
      };

      const handleChangePin = () => {
        const me = roommates.find(r => r.id === currentUser);
        if (!me) return;

        if (oldPinInput !== me.pin) {
          alert('❌ 目前的 PIN 碼不正確！');
          return;
        }
        if (!/^\d{4,6}$/.test(newPinInput)) {
          alert('請輸入 4-6 位數字的新 PIN 碼！');
          return;
        }
        if (newPinInput !== newPinConfirmInput) {
          alert('❌ 兩次輸入的新 PIN 碼不一致！');
          return;
        }

        const duplicate = roommates.find(r => r.id !== me.id && r.pin === newPinInput);
        if (duplicate) {
          alert(`⚠️ 這組 PIN 碼已經被 ${duplicate.name} 使用，請換一組不同的 PIN 碼！`);
          return;
        }

        const updatedRoommates = roommates.map(r => r.id === me.id ? { ...r, pin: newPinInput } : r);
        setRoommates(updatedRoommates);
        saveData(undefined, undefined, undefined, updatedRoommates);

        setShowChangePinModal(false);
        setOldPinInput('');
        setNewPinInput('');
        setNewPinConfirmInput('');
        alert('✅ PIN 碼已更新！');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem(CURRENT_USER_STORAGE_KEY);
        unsettledCheckedForRef.current = null;
      };

      const handleExportBackup = () => {
        const payload = { expenses, dinnerAbsent, settlements, roommates, bills, billSettlements };
        const jsonStr = JSON.stringify(payload, null, 2);
        navigator.clipboard.writeText(jsonStr);
        alert('📋 數據已成功複製到剪貼簿！');
      };

      const handleImportBackup = () => {
        if (!backupJsonInput) return;
        try {
          const parsed = JSON.parse(backupJsonInput);
          if (parsed.expenses) setExpenses(parsed.expenses);
          if (parsed.dinnerAbsent) setDinnerAbsent(parsed.dinnerAbsent);
          if (parsed.settlements) setSettlements(parsed.settlements);
          if (parsed.roommates) setRoommates(parsed.roommates);
          if (parsed.bills) setBills(parsed.bills);
          if (parsed.billSettlements) setBillSettlements(parsed.billSettlements);

          saveData(parsed.expenses, parsed.dinnerAbsent, parsed.settlements, parsed.roommates, parsed.bills, parsed.billSettlements);
          setShowBackupModal(false);
          setBackupJsonInput('');
          alert('✅ 數據已成功匯入並同步至 Supabase 雲端！');
        } catch(e) {
          alert('❌ 格式錯誤，請貼上正確的 JSON 數據。');
        }
      };

      const handleUpdateEmoji = (personId, newEmoji) => {
        if (!newEmoji) return;
        const updated = roommates.map(r => r.id === personId ? { ...r, emoji: newEmoji } : r);
        setRoommates(updated);
        saveData(undefined, undefined, undefined, updated);
        setShowEmojiPickerFor(null);
        setCustomEmojiInput('');
      };

      const [itemTitle, setItemTitle] = useState('');
      const [itemAmount, setItemAmount] = useState('');
      const [itemCategories, setItemCategories] = useState(['veg']);
      const [itemDate, setItemDate] = useState(formatLocalDate(currentNowDate));
      const [itemSplit, setItemSplit] = useState(['Janice', 'Carrie', 'Kingsley']);

      const [receiptPreviewUrl, setReceiptPreviewUrl] = useState(null);
      const [receiptUploading, setReceiptUploading] = useState(false);
      const [receiptStoragePath, setReceiptStoragePath] = useState(null);
      const receiptCleanedPathsRef = React.useRef(new Set());

      const toggleCategoryTag = (catId) => {
        if (itemCategories.includes(catId)) {
          if (itemCategories.length === 1) return alert('至少需選擇一個採購分類！');
          setItemCategories(itemCategories.filter(id => id !== catId));
        } else {
          setItemCategories([...itemCategories, catId]);
        }
      };

      useEffect(() => {
        const absentList = dinnerAbsent[itemDate] || [];
        if (absentList.length > 0) {
          setItemSplit(roommates.map(r => r.id).filter(id => !absentList.includes(id)));
        } else {
          setItemSplit(roommates.map(r => r.id));
        }
      }, [itemDate, dinnerAbsent, roommates]);

      const handleReceiptFileChange = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!currentUser) {
          alert('🔒 請先登入身份！');
          e.target.value = '';
          return;
        }
        if (!supabase) {
          alert('⚠️ Supabase 尚未連線，無法上傳收據。');
          e.target.value = '';
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          alert('圖片太大了，請選擇 8MB 以內的照片。');
          e.target.value = '';
          return;
        }

        setReceiptPreviewUrl(URL.createObjectURL(file));
        setReceiptUploading(true);

        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${itemDate}/${Date.now()}_${safeName}`;

          const { error: uploadError } = await supabase.storage.from(RECEIPT_BUCKET).upload(path, file);
          if (uploadError) throw uploadError;

          setReceiptStoragePath(path);
          // 自動辨識功能暫時收起，之後接上 Edge Function 後再啟用
        } catch (err) {
          alert(`⚠️ 收據上傳失敗：${err.message || err}`);
        } finally {
          setReceiptUploading(false);
        }
      };

      const handleAddExpense = (e) => {
        e.preventDefault();

        if (!currentUser) {
          alert('🔒 權限限制：請先登入身份！');
          return;
        }

        if (!itemTitle || !itemAmount || parseFloat(itemAmount) <= 0 || itemSplit.length === 0) {
          alert('請填寫物品名稱、金額，並選擇至少一位分攤成員！');
          return;
        }

        const newEntry = {
          id: 'exp_' + Date.now(),
          title: itemTitle,
          amount: parseFloat(itemAmount),
          categories: itemCategories,
          payer: currentUser,
          date: itemDate,
          splitWith: itemSplit,
          registeredBy: currentUser,
          createdAt: new Date().toISOString(),
          receiptPath: receiptStoragePath || null
        };

        const updated = [newEntry, ...expenses];
        setExpenses(updated);
        saveData(updated, undefined, undefined, undefined);

        setItemTitle('');
        setItemAmount('');
        setReceiptPreviewUrl(null);
        setReceiptStoragePath(null);
        alert('✨ 成功加入採購明細！Supabase 實時廣播已發送');
      };

      const handleDeleteExpense = (exp) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }

        if (exp.registeredBy !== currentUser) {
          alert(`🔒 權限限制：此筆採購是由 ${exp.registeredBy} 登記的，只有登記本人才可以刪除喔！`);
          return;
        }

        if (confirm(`確定要刪除「${exp.title}」這筆紀錄嗎？`)) {
          const updated = expenses.filter(e => e.id !== exp.id);
          setExpenses(updated);
          saveData(updated, undefined, undefined, undefined);
        }
      };

      const toggleDinnerAbsent = (dateStr, personId) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }

        if (currentUser !== personId) {
          alert(`🔒 權限限制：您目前是 ${currentUser}，只能修改自己的晚餐狀態！`);
          return;
        }

        const currentList = dinnerAbsent[dateStr] || [];
        const updatedList = currentList.includes(personId)
          ? currentList.filter(p => p !== personId)
          : [...currentList, personId];

        const updatedDinner = { ...dinnerAbsent, [dateStr]: updatedList };
        setDinnerAbsent(updatedDinner);
        saveData(undefined, updatedDinner, undefined, undefined);
      };

      const currentWeekObj = useMemo(() => {
        return weeksList.find(w => w.key === selectedWeekKey) || weeksList[0];
      }, [selectedWeekKey, weeksList]);

      const currentWeekExpenses = useMemo(() => {
        const start = new Date(currentWeekObj.startDate);
        start.setHours(0,0,0,0);
        const end = new Date(currentWeekObj.endDate);
        end.setHours(23, 59, 59, 999);

        return expenses.filter(exp => {
          const parts = exp.date.split('-');
          const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
          return d >= start && d <= end;
        });
      }, [expenses, currentWeekObj]);

      const weeklyCalculation = useMemo(() => {
        return calculateTransfers(currentWeekExpenses, roommates);
      }, [currentWeekExpenses, roommates]);

      const weekPayments = (settlements[selectedWeekKey] && settlements[selectedWeekKey].payments) || [];
      const weekSettlementPairs = useMemo(() => {
        return buildSettlementPairs(currentWeekExpenses, weekPayments, roommates);
      }, [currentWeekExpenses, weekPayments, roommates]);

      const handleMarkWeekPayment = (pair) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }
        if (currentUser !== pair.from) {
          alert(`🔒 權限限制：付款方為 ${pair.from}，只能由 ${pair.from} 本人標記付款！`);
          return;
        }

        const undeclared = Math.round((pair.remaining - pair.pendingTotal) * 100) / 100;
        const raw = weekPayAmountInputs[pair.pairKey];
        const amt = parseFloat(raw !== undefined && raw !== '' ? raw : undeclared);

        if (!amt || amt <= 0) {
          alert('請輸入有效的付款金額！');
          return;
        }
        if (amt > undeclared + 0.01) {
          alert(`付款金額不能超過剩餘未付金額 £${undeclared.toFixed(2)}！`);
          return;
        }

        const newRecord = {
          id: 'pay_' + Date.now(),
          pairKey: pair.pairKey,
          from: pair.from,
          to: pair.to,
          amount: parseFloat(amt.toFixed(2)),
          payerPaid: true,
          receiverConfirmed: false,
          createdAt: new Date().toISOString()
        };

        const weekData = settlements[selectedWeekKey] || {};
        const payments = weekData.payments || [];
        const updatedWeekData = { ...weekData, payments: [...payments, newRecord] };
        const updatedSettlements = { ...settlements, [selectedWeekKey]: updatedWeekData };

        setSettlements(updatedSettlements);
        saveData(undefined, undefined, updatedSettlements, undefined);

        setWeekPayAmountInputs({ ...weekPayAmountInputs, [pair.pairKey]: '' });
        setExpandedWeekPairs({ ...expandedWeekPairs, [pair.pairKey]: true });
      };

      const handleConfirmWeekPayment = (record) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }
        if (currentUser !== record.to) {
          alert(`🔒 權限限制：收款方為 ${record.to}，只能由 ${record.to} 本人確認！`);
          return;
        }

        const weekData = settlements[selectedWeekKey] || {};
        const payments = weekData.payments || [];
        const updatedPayments = payments.map(p =>
          p.id === record.id ? { ...p, receiverConfirmed: true, confirmedAt: new Date().toISOString() } : p
        );
        const updatedWeekData = { ...weekData, payments: updatedPayments };
        const updatedSettlements = { ...settlements, [selectedWeekKey]: updatedWeekData };

        setSettlements(updatedSettlements);
        saveData(undefined, undefined, updatedSettlements, undefined);
      };

      // ===== 每月帳單 (電費 / 水費 / Council Tax) =====

      useEffect(() => {
        setBillSplit(roommates.map(r => r.id));
      }, [roommates]);

      // 登入的人若不是該帳單類型的固定登記人，自動切換到「其他帳單」
      useEffect(() => {
        if (currentUser && FIXED_BILL_PAYERS[billType] && FIXED_BILL_PAYERS[billType] !== currentUser) {
          setBillType('other');
        }
      }, [currentUser]);

      const currentMonthObj = useMemo(() => {
        return monthsList.find(m => m.key === selectedMonthKey) || monthsList[0];
      }, [selectedMonthKey, monthsList]);

      const currentMonthBills = useMemo(() => {
        return bills.filter(b => b.month === currentMonthObj.key);
      }, [bills, currentMonthObj]);

      const monthlyCalculation = useMemo(() => {
        return calculateTransfers(currentMonthBills, roommates);
      }, [currentMonthBills, roommates]);

      const handleAddBill = (e) => {
        e.preventDefault();

        if (!currentUser) {
          alert('🔒 權限限制：請先登入身份！');
          return;
        }

        if (FIXED_BILL_PAYERS[billType] && currentUser !== FIXED_BILL_PAYERS[billType]) {
          const typeName = (BILL_TYPES.find(t => t.id === billType) || {}).name || '此帳單';
          alert(`🔒 權限限制：${typeName} 只有 ${FIXED_BILL_PAYERS[billType]} 可以登記！`);
          return;
        }

        if (!billAmount || parseFloat(billAmount) <= 0 || billSplit.length === 0) {
          alert('請填寫金額，並選擇至少一位分攤成員！');
          return;
        }

        const typeObj = BILL_TYPES.find(t => t.id === billType) || BILL_TYPES[BILL_TYPES.length - 1];
        const newEntry = {
          id: 'bill_' + Date.now(),
          type: billType,
          title: typeObj.name,
          amount: parseFloat(billAmount),
          payer: FIXED_BILL_PAYERS[billType] || currentUser,
          month: currentMonthObj.key,
          splitWith: billSplit,
          registeredBy: currentUser,
          createdAt: new Date().toISOString()
        };

        const updated = [newEntry, ...bills];
        setBills(updated);
        saveData(undefined, undefined, undefined, undefined, updated);

        setBillAmount('');
        alert('✨ 成功加入帳單！');
      };

      const handleDeleteBill = (bill) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }

        if (bill.registeredBy !== currentUser) {
          alert(`🔒 權限限制：此筆帳單是由 ${bill.registeredBy} 登記的，只有登記本人才可以刪除喔！`);
          return;
        }

        if (confirm(`確定要刪除「${bill.title}」這筆紀錄嗎？`)) {
          const updated = bills.filter(b => b.id !== bill.id);
          setBills(updated);
          saveData(undefined, undefined, undefined, undefined, updated);
        }
      };

      const monthPayments = (billSettlements[currentMonthObj.key] && billSettlements[currentMonthObj.key].payments) || [];
      const monthSettlementPairs = useMemo(() => {
        return buildSettlementPairs(currentMonthBills, monthPayments, roommates);
      }, [currentMonthBills, monthPayments, roommates]);

      const handleMarkMonthPayment = (pair) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }
        if (currentUser !== pair.from) {
          alert(`🔒 權限限制：付款方為 ${pair.from}，只能由 ${pair.from} 本人標記付款！`);
          return;
        }

        const undeclared = Math.round((pair.remaining - pair.pendingTotal) * 100) / 100;
        const raw = monthPayAmountInputs[pair.pairKey];
        const amt = parseFloat(raw !== undefined && raw !== '' ? raw : undeclared);

        if (!amt || amt <= 0) {
          alert('請輸入有效的付款金額！');
          return;
        }
        if (amt > undeclared + 0.01) {
          alert(`付款金額不能超過剩餘未付金額 £${undeclared.toFixed(2)}！`);
          return;
        }

        const newRecord = {
          id: 'pay_' + Date.now(),
          pairKey: pair.pairKey,
          from: pair.from,
          to: pair.to,
          amount: parseFloat(amt.toFixed(2)),
          payerPaid: true,
          receiverConfirmed: false,
          createdAt: new Date().toISOString()
        };

        const monthData = billSettlements[currentMonthObj.key] || {};
        const payments = monthData.payments || [];
        const updatedMonthData = { ...monthData, payments: [...payments, newRecord] };
        const updatedBillSettlements = { ...billSettlements, [currentMonthObj.key]: updatedMonthData };

        setBillSettlements(updatedBillSettlements);
        saveData(undefined, undefined, undefined, undefined, undefined, updatedBillSettlements);

        setMonthPayAmountInputs({ ...monthPayAmountInputs, [pair.pairKey]: '' });
        setExpandedMonthPairs({ ...expandedMonthPairs, [pair.pairKey]: true });
      };

      const handleConfirmMonthPayment = (record) => {
        if (!currentUser) {
          alert('🔒 請先登入身份！');
          return;
        }
        if (currentUser !== record.to) {
          alert(`🔒 權限限制：收款方為 ${record.to}，只能由 ${record.to} 本人確認！`);
          return;
        }

        const monthData = billSettlements[currentMonthObj.key] || {};
        const payments = monthData.payments || [];
        const updatedPayments = payments.map(p =>
          p.id === record.id ? { ...p, receiverConfirmed: true, confirmedAt: new Date().toISOString() } : p
        );
        const updatedMonthData = { ...monthData, payments: updatedPayments };
        const updatedBillSettlements = { ...billSettlements, [currentMonthObj.key]: updatedMonthData };

        setBillSettlements(updatedBillSettlements);
        saveData(undefined, undefined, undefined, undefined, undefined, updatedBillSettlements);
      };

      // ===== 登入時檢查是否有未結算款項 =====

      useEffect(() => {
        if (!currentUser || syncStatus !== 'online') return;
        if (unsettledCheckedForRef.current === currentUser) return;
        unsettledCheckedForRef.current = currentUser;

        const items = [];

        weeksList.forEach(week => {
          const start = new Date(week.startDate);
          start.setHours(0, 0, 0, 0);
          const end = new Date(week.endDate);
          end.setHours(23, 59, 59, 999);

          const weekExpenses = expenses.filter(exp => {
            const parts = exp.date.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return d >= start && d <= end;
          });
          if (weekExpenses.length === 0) return;

          const weekPays = (settlements[week.key] && settlements[week.key].payments) || [];
          const pairs = buildSettlementPairs(weekExpenses, weekPays, roommates);

          // 先提示付款人付款（有未付且未申報的金額）；付款人申報已付款後，才提示收款人確認消帳
          pairs.forEach(pair => {
            const undeclared = Math.round((pair.remaining - pair.pendingTotal) * 100) / 100;
            if (pair.from === currentUser && undeclared > 0.009) {
              items.push({ kind: 'week', kindLabel: '週採購', periodLabel: week.label, periodKey: week.key, pair, role: 'payer', amount: undeclared });
            } else if (pair.to === currentUser && pair.pendingTotal > 0.009) {
              items.push({ kind: 'week', kindLabel: '週採購', periodLabel: week.label, periodKey: week.key, pair, role: 'receiver', amount: pair.pendingTotal });
            }
          });
        });

        monthsList.forEach(month => {
          const monthBills = bills.filter(b => b.month === month.key);
          if (monthBills.length === 0) return;

          const monthPays = (billSettlements[month.key] && billSettlements[month.key].payments) || [];
          const pairs = buildSettlementPairs(monthBills, monthPays, roommates);

          pairs.forEach(pair => {
            const undeclared = Math.round((pair.remaining - pair.pendingTotal) * 100) / 100;
            if (pair.from === currentUser && undeclared > 0.009) {
              items.push({ kind: 'month', kindLabel: '月帳單', periodLabel: month.label, periodKey: month.key, pair, role: 'payer', amount: undeclared });
            } else if (pair.to === currentUser && pair.pendingTotal > 0.009) {
              items.push({ kind: 'month', kindLabel: '月帳單', periodLabel: month.label, periodKey: month.key, pair, role: 'receiver', amount: pair.pendingTotal });
            }
          });
        });

        if (items.length > 0) {
          setUnsettledItems(items);
          setShowUnsettledModal(true);
        }
      }, [currentUser, syncStatus, expenses, settlements, bills, billSettlements, roommates, weeksList, monthsList]);

      // ===== 每月 1 號房租提醒 (只是提醒，不涉及登記/追蹤) =====

      useEffect(() => {
        if (!currentUser) return;
        const today = new Date();
        if (today.getDate() !== 1) return;

        const monthKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
        const storageKey = `ROOM204_RENT_REMINDER_${currentUser}_${monthKey}`;
        if (localStorage.getItem(storageKey)) return;

        localStorage.setItem(storageKey, '1');
        setShowRentReminderModal(true);
      }, [currentUser]);

      // ===== 收據圖片清理：該週結清後，或超過 7 天，就從 Storage 刪除 =====

      useEffect(() => {
        if (!supabase || syncStatus !== 'online') return;

        const now = Date.now();
        const toDelete = [];

        expenses.forEach(exp => {
          if (!exp.receiptPath) return;
          if (receiptCleanedPathsRef.current.has(exp.receiptPath)) return;

          const ageDays = (now - new Date(exp.createdAt).getTime()) / (1000 * 60 * 60 * 24);

          const week = weeksList.find(w => {
            const parts = exp.date.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return d >= w.startDate && d <= w.endDate;
          });

          let weekFullySettled = false;
          if (week) {
            const weekExpenses = expenses.filter(e2 => {
              const parts = e2.date.split('-');
              const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
              return d >= week.startDate && d <= week.endDate;
            });
            const weekPays = (settlements[week.key] && settlements[week.key].payments) || [];
            const pairs = buildSettlementPairs(weekExpenses, weekPays, roommates);
            weekFullySettled = pairs.every(p => p.remaining <= 0.009);
          }

          if (weekFullySettled || ageDays > RECEIPT_RETENTION_DAYS) {
            toDelete.push(exp);
          }
        });

        if (toDelete.length === 0) return;
        toDelete.forEach(exp => receiptCleanedPathsRef.current.add(exp.receiptPath));

        (async () => {
          try {
            await supabase.storage.from(RECEIPT_BUCKET).remove(toDelete.map(exp => exp.receiptPath));
          } catch (e) {
            // 刪圖失敗不影響帳目資料，下次載入時會依 ref 判斷是否需要重試
          }

          const updatedExpenses = expenses.map(exp =>
            toDelete.some(d => d.id === exp.id) ? { ...exp, receiptPath: null } : exp
          );
          setExpenses(updatedExpenses);
          saveData(updatedExpenses, undefined, undefined, undefined);
        })();
      }, [syncStatus, expenses, settlements, roommates, weeksList]);

      const getRoommateObj = (id) => roommates.find(r => r.id === id) || { name: id, emoji: '👤' };
      const getCategoryObj = (catId) => CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
      const getBillTypeObj = (typeId) => BILL_TYPES.find(t => t.id === typeId) || BILL_TYPES[BILL_TYPES.length - 1];

      const currentRmUserObj = currentUser ? getRoommateObj(currentUser) : null;

      return (
        <div className="max-w-3xl mx-auto p-4 pb-24">
          {/* Header */}
          <header className="bg-white rounded-3xl p-6 shadow-sm mb-5 border-2 border-rose-100 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-3xl">🏠</span>
                <h1 className="text-2xl font-bold text-slate-800 tracking-tight">204室小帳本</h1>
                
                {/* Supabase 實時燈號 */}
                <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 transition shadow-sm ${
                  syncStatus === 'syncing' 
                    ? 'bg-amber-100 text-amber-800 border border-amber-300' 
                    : syncStatus === 'online'
                      ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                      : 'bg-rose-100 text-rose-800 border border-rose-300'
                }`}>
                  <i className={`fa-solid ${
                    syncStatus === 'syncing' ? 'fa-spinner fa-spin' : syncStatus === 'online' ? 'fa-bolt' : 'fa-triangle-exclamation'
                  }`}></i>
                  <span>
                    {syncStatus === 'syncing' ? 'Supabase 同步中...' : syncStatus === 'online' ? `Supabase 毫秒實時連線 (${lastSyncTime || '已連線'})` : '金鑰設定未完成 / 離線'}
                  </span>
                </span>
              </div>

              <p className="text-xs text-rose-500 font-medium mt-1">Janice • Carrie • Kingsley 買菜與晚餐記錄小幫手</p>
            </div>

            {/* 帳號登入 & 備份 */}
            <div className="flex flex-col gap-2 items-start md:items-end">
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => setShowBackupModal(true)}
                  className="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold px-3 py-1.5 rounded-full text-xs transition flex items-center gap-1.5"
                >
                  <i className="fa-solid fa-database"></i>
                  <span>備份</span>

                      </label>
                      <input
                        type="password"
                        inputMode="numeric"
                        maxLength="6"
                        placeholder={isFirstTimeSetup ? '設定新 PIN 碼' : '輸入 PIN 碼'}
                        value={pinInput}
                        onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))}
                        onKeyDown={(e) => { if (e.key === 'Enter') handlePinLogin(); }}
                        className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3.5 py-2 text-sm tracking-widest focus:outline-none focus:border-rose-400"
                      />
                      {isFirstTimeSetup && (
                        <p className="text-[10px] text-amber-600 mt-1">⚠️ 這組 PIN 碼之後每次登入都要用，請記住！</p>
                      )}
                      {!isFirstTimeSetup && (
                        <button
                          type="button"
                          onClick={() => handleResetPin(bindTarget)}
                          className="text-[10px] text-rose-500 hover:text-rose-600 font-bold mt-1 underline"
                        >
                          忘記 PIN 碼？點此重設
                        </button>
                      )}
                    </div>

                    <button
                      onClick={handlePinLogin}
                      className="w-full bg-rose-500 text-white font-bold py-2.5 rounded-2xl shadow-md hover:bg-rose-600 transition text-xs"
                    >
                      {isFirstTimeSetup ? '設定並登入' : '登入'}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Modal: 修改 PIN */}
          {showChangePinModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-2 border-rose-100 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <i className="fa-solid fa-key text-rose-500"></i>
                    修改 PIN 碼
                  </h3>
                  <button
                    onClick={() => {
                      setShowChangePinModal(false);
                      setOldPinInput('');
                      setNewPinInput('');
                      setNewPinConfirmInput('');
                    }}
                    className="text-slate-400 hover:text-slate-600"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">目前的 PIN 碼：</label>
                    <input
                      type="password"
                      inputMode="numeric"
                      maxLength="6"
                      value={oldPinInput}
                      onChange={(e) => setOldPinInput(e.target.value.replace(/\D/g, ''))}
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3.5 py-2 text-sm tracking-widest focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">新的 PIN 碼 (4-6 位數字)：</label>
                    <input
                      type="password"
                      inputMode="numeric"
                      maxLength="6"
                      value={newPinInput}
                      onChange={(e) => setNewPinInput(e.target.value.replace(/\D/g, ''))}
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3.5 py-2 text-sm tracking-widest focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">再次輸入新的 PIN 碼：</label>
                    <input
                      type="password"
                      inputMode="numeric"
                      maxLength="6"
                      value={newPinConfirmInput}
                      onChange={(e) => setNewPinConfirmInput(e.target.value.replace(/\D/g, ''))}
                      onKeyDown={(e) => { if (e.key === 'Enter') handleChangePin(); }}
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3.5 py-2 text-sm tracking-widest focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <button
                    onClick={handleChangePin}
                    className="w-full bg-rose-500 text-white font-bold py-2.5 rounded-2xl shadow-md hover:bg-rose-600 transition text-xs"
                  >
                    確認修改
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: 未結算提醒 */}
          {showUnsettledModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-2 border-amber-200 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <i className="fa-solid fa-triangle-exclamation text-amber-500"></i>
                    你有 {unsettledItems.length} 筆未結算款項
                  </h3>
                  <button onClick={() => setShowUnsettledModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-2">
                  {unsettledItems.map((item, idx) => {
                    const fromObj = getRoommateObj(item.pair.from);
                    const toObj = getRoommateObj(item.pair.to);
                    const iOwe = item.role === 'payer';

                    return (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => {
                          if (item.kind === 'week') {
                            setSelectedWeekKey(item.periodKey);
                            setActiveTab('settlement');
                          } else {
                            setSelectedMonthKey(item.periodKey);
                            setActiveTab('bills');
                          }
                          setShowUnsettledModal(false);
                        }}
                        className="w-full text-left bg-amber-50/60 hover:bg-amber-100/60 border-2 border-amber-100 rounded-2xl p-3 transition"
                      >
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">
                            {item.kindLabel} · {item.periodLabel}
                          </span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${iOwe ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                            {iOwe ? '你要付款' : '你要收款'}
                          </span>
                        </div>
                        <div className="flex items-center gap-2 font-bold text-slate-800 text-sm mt-2">
                          <span>{fromObj.emoji} {fromObj.name}</span>
                          <i className="fa-solid fa-arrow-right text-rose-400 text-xs"></i>
                          <span>{toObj.emoji} {toObj.name}</span>
                          <span className="text-rose-600 font-extrabold text-base ml-1">£{item.amount.toFixed(2)}</span>
                        </div>
                        <div className="text-[10px] text-slate-400 mt-1">
                          {iOwe ? '尚未申報付款' : '付款方已申報付款，待你確認收款'}
                        </div>
                      </button>
                    );
                  })}
                </div>

                <button
                  onClick={() => setShowUnsettledModal(false)}
                  className="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-2xl transition text-xs"
                >
                  知道了，稍後處理
                </button>
              </div>
            </div>
          )}

          {/* Modal: 每月 1 號房租提醒 */}
          {showRentReminderModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-2 border-indigo-200 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <span className="text-xl">📅</span>
                    今天是 1 號
                  </h3>
                  <button onClick={() => setShowRentReminderModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <p className="text-sm text-slate-600">別忘了處理本月房租！</p>
                <button
                  onClick={() => setShowRentReminderModal(false)}
                  className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2.5 rounded-2xl shadow-md transition text-xs"
                >
                  知道了
                </button>
              </div>
            </div>
          )}

          {/* Modal: 數據備份 */}
          {showBackupModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border-2 border-rose-100 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <i className="fa-solid fa-database text-rose-500"></i>
                    數據備份與匯入
                  </h3>
                  <button onClick={() => setShowBackupModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-3">
                  <button
                    onClick={handleExportBackup}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-2xl shadow transition text-xs flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-copy"></i>
                    一鍵複製現有帳本備份 (Copy JSON)
                  </button>

                  <div className="pt-2 border-t border-slate-200">
                    <label className="block text-xs font-bold text-slate-600 mb-1">匯入舊數據備份 (貼上 JSON)：</label>
                    <textarea
                      rows="4"
                      value={backupJsonInput}
                      onChange={(e) => setBackupJsonInput(e.target.value)}
                      placeholder='貼上包含 {"expenses": [...]} 的備份文字'
                      className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-2.5 text-xs font-mono focus:outline-none focus:border-rose-400"
                    ></textarea>
                    <button
                      onClick={handleImportBackup}
                      className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 rounded-2xl shadow transition text-xs mt-2"
                    >
                      確認匯入數據
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
