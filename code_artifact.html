    <title>室友煮飯採購分攤帳本 - Janice, Carrie, Kingsley</title>
    <!-- Tailwind CSS -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Placeholders for standalone exported HTML files
        const embeddedConfig = /* EMBEDDED_CONFIG_PLACEHOLDER */ null;
        const embeddedAppId = /* EMBEDDED_APP_ID_PLACEHOLDER */ null;

        // Default public fallback Firebase config for hosted deployments (e.g. Netlify / Vercel / GitHub Pages)
        const publicDefaultConfig = {
            apiKey: "AIzaSyD-PlaceholderForPublicHost",
            authDomain: "cook-share-ledger.firebaseapp.com",
            projectId: "cook-share-ledger",
            storageBucket: "cook-share-ledger.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            } else if (embeddedConfig) {
                firebaseConfig = embeddedConfig;
            }
        } catch(e) {
            console.error("Config parse error", e);
        }

        const appId = typeof __app_id !== 'undefined' && __app_id ? __app_id : (embeddedAppId || 'cook-share-ledger-v1');

        if (firebaseConfig && firebaseConfig.apiKey) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.CloudSync = {
                app, auth, db, appId, config: firebaseConfig,
                signInAnonymously, signInWithCustomToken,
                doc, setDoc, deleteDoc, onSnapshot, collection
            };
        }
        window.dispatchEvent(new Event('cloud-sync-ready'));
    </script>

<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <div id="root"></div>

    <script type="text/babel">
        const ROOMMATES_DEFAULT = [
            { id: 'Janice', name: 'Janice', avatar: '👩‍🍳', color: 'bg-rose-100 text-rose-700 border-rose-200' },
            { id: 'Carrie', name: 'Carrie', avatar: '👩‍🌾', color: 'bg-amber-100 text-amber-700 border-amber-200' },
            { id: 'Kingsley', name: 'Kingsley', avatar: '👨‍🍳', color: 'bg-indigo-100 text-indigo-700 border-indigo-200' }
        ];

        const EMOJI_PRESETS = [
            '👩‍🍳', '👨‍🍳', '👩‍🌾', '👨‍🌾', '🥑', '🥩', '🍣', '🍕', '🥗', '🍔', 
            '🥟', '🍜', '🍰', '☕', '🐱', '🐶', '🦊', '🐼', '🦁', '👑', 
            '🌟', '🌶️', '🍱', '🍻'
        ];

        const CATEGORIES = [
            { id: 'veggies', name: '蔬菜水果', emoji: '🥬' },
            { id: 'meat', name: '肉類海鮮', emoji: '🥩' },
            { id: 'seasoning', name: '調味料/油', emoji: '🧂' },
            { id: 'dry', name: '乾糧麵米', emoji: '🍚' },
            { id: 'snacks', name: '零食飲料', emoji: '🥤' },
            { id: 'other', name: '其他雜項', emoji: '🛒' }
        ];

        // Helper: Get ISO Week string like "2026-W37" and Start/End Dates
        function getWeekInfo(dateInput) {
            const date = new Date(dateInput);
            date.setHours(0, 0, 0, 0);
            
            // Thursday in current week decides the year.
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            const weekNum = Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7) + 1;
            
            const year = date.getFullYear();
            const weekKey = `${year}-W${weekNum < 10 ? '0' + weekNum : weekNum}`;

            // Calculate start (Monday) and end (Sunday) of week
            const current = new Date(dateInput);
            const day = current.getDay();
            const diffToMon = current.getDate() - day + (day === 0 ? -6 : 1);
            
            const monday = new Date(current.setDate(diffToMon));
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const formatDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
            const label = `${weekKey} (${formatDate(monday)} ~ ${formatDate(sunday)})`;

            return { weekKey, label, monday, sunday };
        }

        function getDatesOfWeek(weekKey) {
            if (!weekKey) return [];
            const parts = weekKey.split('-W');
            if (parts.length < 2) return [];
            const year = parseInt(parts[0], 10);
            const week = parseInt(parts[1], 10);

            const jan4 = new Date(year, 0, 4);
            const dayOfWeek = jan4.getDay() || 7;
            const mon1 = new Date(jan4);
            mon1.setDate(jan4.getDate() - dayOfWeek + 1);

            const targetMon = new Date(mon1);
            targetMon.setDate(mon1.getDate() + (week - 1) * 7);

            const days = [];
            const dayNames = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
            const todayIso = new Date().toISOString().split('T')[0];

            for (let i = 0; i < 7; i++) {
                const d = new Date(targetMon);
                d.setDate(targetMon.getDate() + i);
                const isoStr = d.toISOString().split('T')[0];
                const dateLabel = `${d.getMonth() + 1}/${d.getDate()}`;
                days.push({ 
                    dateStr: isoStr, 
                    label: dateLabel, 
                    dayName: dayNames[i], 
                    isToday: isoStr === todayIso 
                });
            }
            return days;
        }

        // Get initial current week key
        const CURRENT_WEEK_KEY = getWeekInfo(new Date()).weekKey;

        // Default initial expenses cleared to start fresh from today
        const INITIAL_EXPENSES = [];

        function App() {
            const [roommates, setRoommates] = React.useState(() => {
                const saved = localStorage.getItem('cook_roommates_v2');
                return saved ? JSON.parse(saved) : ROOMMATES_DEFAULT;
            });

            // Ledger Code state for cross-device & external room sync
            const [ledgerCode, setLedgerCode] = React.useState(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const codeFromUrl = urlParams.get('code');
                if (codeFromUrl) return codeFromUrl.trim();
                const saved = localStorage.getItem('cook_ledger_code_v1');
                return saved ? saved : 'cook-flat-888';
            });

            const [showShareModal, setShowShareModal] = React.useState(false);
            const [inputLedgerCode, setInputLedgerCode] = React.useState('');

            const [dinnersOut, setDinnersOut] = React.useState(() => {
                const saved = localStorage.getItem('cook_dinners_out_v1');
                return saved ? JSON.parse(saved) : {};
            });

            const [expenses, setExpenses] = React.useState(() => {
                const saved = localStorage.getItem('cook_expenses_v1');
                return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
            });

            const [settledWeeks, setSettledWeeks] = React.useState(() => {
                const saved = localStorage.getItem('cook_settled_weeks_v1');
                return saved ? JSON.parse(saved) : [];
            });

            const [syncStatus, setSyncStatus] = React.useState('connecting'); // 'connecting', 'connected', 'offline'
            const [selectedWeek, setSelectedWeek] = React.useState(CURRENT_WEEK_KEY);
            const [activeTab, setActiveTab] = React.useState('dashboard'); // 'dashboard', 'add', 'dinners', 'list'
            const [toast, setToast] = React.useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);
            const [showResetConfirm, setShowResetConfirm] = React.useState(false);
            
            const [importInput, setImportInput] = React.useState('');
            const [showImportBox, setShowImportBox] = React.useState(false);

            // Custom Avatar Modal State
            const [showAvatarModal, setShowAvatarModal] = React.useState(false);
            const [editingRoommateId, setEditingRoommateId] = React.useState('Janice');
            const [customEmojiInput, setCustomEmojiInput] = React.useState('');

            // Form State
            const [title, setTitle] = React.useState('');
            const [amount, setAmount] = React.useState('');
            const [payer, setPayer] = React.useState('Janice');
            const [participants, setParticipants] = React.useState(['Janice', 'Carrie', 'Kingsley']);
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [category, setCategory] = React.useState('veggies');
            const [note, setNote] = React.useState('');
            const [autoExcludedNote, setAutoExcludedNote] = React.useState('');

            React.useEffect(() => {
                let unsubExp = null, unsubDin = null, unsubSet = null, unsubRm = null;

                const initSync = async () => {
                    if (!window.CloudSync) {
                        setSyncStatus('offline');
                        return;
                    }
                    const { auth, db, appId, signInAnonymously, signInWithCustomToken, doc, setDoc, onSnapshot, collection } = window.CloudSync;

                    try {
                        let user = null;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try {
                                const cred = await signInWithCustomToken(auth, __initial_auth_token);
                                user = cred.user;
                            } catch(e) {
                                const cred = await signInAnonymously(auth);
                                user = cred.user;
                            }
                        } else {
                            const cred = await signInAnonymously(auth);
                            user = cred.user;
                        }

                        if (!user) {
                            setSyncStatus('offline');
                            return;
                        }
                        setSyncStatus('connected');

                        // 1. Listen to Expenses (filtered by ledgerCode)
                        const expCol = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
                        unsubExp = onSnapshot(expCol, (snapshot) => {
                            const list = [];
                            snapshot.forEach(d => {
                                const data = d.data();
                                if (!data.ledgerCode || data.ledgerCode === ledgerCode) {
                                    list.push(data);
                                }
                            });
                            setExpenses(list.sort((a, b) => new Date(b.date) - new Date(a.date)));
                        }, (err) => console.error("Exp sync err:", err));

                        // 2. Listen to Dinners (filtered by ledgerCode)
                        const dinCol = collection(db, 'artifacts', appId, 'public', 'data', 'dinners');
                        unsubDin = onSnapshot(dinCol, (snapshot) => {
                            const map = {};
                            snapshot.forEach(d => {
                                const data = d.data();
                                if (!data.ledgerCode || data.ledgerCode === ledgerCode) {
                                    map[d.id] = data;
                                }
                            });
                            setDinnersOut(map);
                        }, (err) => console.error("Din sync err:", err));

                        // 3. Listen to Settled Weeks
                        const setCol = collection(db, 'artifacts', appId, 'public', 'data', 'settledWeeks');
                        unsubSet = onSnapshot(setCol, (snapshot) => {
                            const weeks = [];
                            snapshot.forEach(d => {
                                const data = d.data();
                                if ((!data.ledgerCode || data.ledgerCode === ledgerCode) && data.settled) {
                                    weeks.push(d.id.replace(`${ledgerCode}_`, ''));
                                }
                            });
                            setSettledWeeks(weeks);
                        }, (err) => console.error("Set sync err:", err));

                        // 4. Listen to Roommates
                        const rmCol = collection(db, 'artifacts', appId, 'public', 'data', 'roommates');
                        unsubRm = onSnapshot(rmCol, (snapshot) => {
                            const list = [];
                            snapshot.forEach(d => list.push(d.data()));
                            if (list.length > 0) {
                                setRoommates(list);
                            } else {
                                ROOMMATES_DEFAULT.forEach(r => {
                                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'roommates', r.id), r);
                                });
                            }
                        }, (err) => console.error("Rm sync err:", err));

                    } catch(err) {
                        console.error("Cloud init err:", err);
                        setSyncStatus('offline');
                    }
                };

                if (window.CloudSync) {
                    initSync();
                } else {
                    window.addEventListener('cloud-sync-ready', initSync);
                }

                return () => {
                    if (unsubExp) unsubExp();
                    if (unsubDin) unsubDin();
                    if (unsubSet) unsubSet();
                    if (unsubRm) unsubRm();
                    window.removeEventListener('cloud-sync-ready', initSync);
                };
            }, [ledgerCode]);

            // LocalStorage fallbacks
            React.useEffect(() => {
                localStorage.setItem('cook_roommates_v2', JSON.stringify(roommates));
            }, [roommates]);

            React.useEffect(() => {
                localStorage.setItem('cook_dinners_out_v1', JSON.stringify(dinnersOut));
            }, [dinnersOut]);

            React.useEffect(() => {
                localStorage.setItem('cook_expenses_v1', JSON.stringify(expenses));
            }, [expenses]);

            React.useEffect(() => {
                localStorage.setItem('cook_settled_weeks_v1', JSON.stringify(settledWeeks));
            }, [settledWeeks]);

            React.useEffect(() => {
                localStorage.setItem('cook_ledger_code_v1', ledgerCode);
            }, [ledgerCode]);

            const handleJoinLedger = (newCode) => {
                if (!newCode || !newCode.trim()) return;
                const cleanCode = newCode.trim();
                setLedgerCode(cleanCode);
                setShowShareModal(false);
                showToast(`🔄 已成功切換至帳本房間：${cleanCode}`);
            };

            const handleCopyShareLink = () => {
                let url = window.location.href.split('?')[0];
                const shareUrl = `${url}?code=${encodeURIComponent(ledgerCode)}`;
                
                const textarea = document.createElement('textarea');
                textarea.value = shareUrl;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('🔗 已複製專屬帳本分享連結！發送給室友即可同步');
                } catch (e) {
                    showToast('複製失敗');
                }
                document.body.removeChild(textarea);
            };

            const handleCopyCodeOnly = () => {
                const textarea = document.createElement('textarea');
                textarea.value = ledgerCode;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('🔑 已複製帳本房間代碼！');
                } catch (e) {
                    showToast('複製失敗');
                }
                document.body.removeChild(textarea);
            };

            // Download self-contained single .html app file for roommates with baked-in cloud credentials
            const handleDownloadHtml = () => {
                try {
                    let currentCfg = null;
                    try {
                        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                            currentCfg = JSON.parse(__firebase_config);
                        } else if (window.CloudSync && window.CloudSync.config) {
                            currentCfg = window.CloudSync.config;
                        }
                    } catch(e) {}

                    const currentAppId = typeof __app_id !== 'undefined' && __app_id ? __app_id : (window.CloudSync?.appId || 'cook-share-ledger-v1');

                    let htmlContent = document.documentElement.outerHTML;

                    // Embed active credentials into exported HTML so roommates get instant Firebase connection
                    if (currentCfg) {
                        htmlContent = htmlContent.replace('/* EMBEDDED_CONFIG_PLACEHOLDER */ null', JSON.stringify(currentCfg));
                    }
                    if (currentAppId) {
                        htmlContent = htmlContent.replace('/* EMBEDDED_APP_ID_PLACEHOLDER */ null', JSON.stringify(currentAppId));
                    }

                    const blob = new Blob(['<!DOCTYPE html>\n' + htmlContent], { type: 'text/html;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `室友煮飯帳本_${ledgerCode}.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('📥 已成功匯出包含雲端同步密鑰的網頁檔！傳給室友即可跨裝置同步');
                } catch (e) {
                    showToast('⚠️ 下載失敗，請重試');
                }
            };

            // Export JSON backup data
            const handleExportData = () => {
                const data = { expenses, dinnersOut, settledWeeks, roommates, ledgerCode, exportedAt: new Date().toISOString() };
                const jsonStr = JSON.stringify(data, null, 2);
                const textarea = document.createElement('textarea');
                textarea.value = jsonStr;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 已複製 JSON 備份文字！可發送給室友進行匯入');
                } catch (err) {
                    showToast('複製失敗');
                }
                document.body.removeChild(textarea);
            };

            // Import JSON backup data
            const handleImportData = () => {
                if (!importInput.trim()) return;
                try {
                    const data = JSON.parse(importInput.trim());
                    if (data.expenses && Array.isArray(data.expenses)) setExpenses(data.expenses);
                    if (data.dinnersOut && typeof data.dinnersOut === 'object') setDinnersOut(data.dinnersOut);
                    if (data.settledWeeks && Array.isArray(data.settledWeeks)) setSettledWeeks(data.settledWeeks);
                    if (data.roommates && Array.isArray(data.roommates)) setRoommates(data.roommates);
                    if (data.ledgerCode) setLedgerCode(data.ledgerCode);
                    setShowImportBox(false);
                    setImportInput('');
                    showToast('🎉 資料已成功匯入與更新！');
                } catch (e) {
                    showToast('⚠️ 貼上的資料格式不符合，請確認為正確的 JSON 文字');
                }
            };

            // Reset all expenses and records to start fresh
            const handleResetAll = () => {
                if (window.CloudSync) {
                    const { db, appId, doc, deleteDoc } = window.CloudSync;
                    expenses.forEach(exp => {
                        if (!exp.ledgerCode || exp.ledgerCode === ledgerCode) {
                            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', exp.id));
                        }
                    });
                    Object.keys(dinnersOut).forEach(key => {
                        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dinners', key));
                    });
                    settledWeeks.forEach(w => {
                        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settledWeeks', `${ledgerCode}_${w}`));
                    });
                }

                setExpenses([]);
                setDinnersOut({});
                setSettledWeeks([]);
                localStorage.removeItem('cook_expenses_v1');
                localStorage.removeItem('cook_dinners_out_v1');
                localStorage.removeItem('cook_settled_weeks_v1');

                setShowResetConfirm(false);
                showToast('🧹 帳本資料已全面清零，今天開始重新計算！');
            };

            React.useEffect(() => {
                if (!date) return;
                const outPeopleNames = roommates
                    .filter(r => dinnersOut[`${date}_${r.id}`]?.out)
                    .map(r => r.name);

                const homePeopleIds = roommates
                    .filter(r => !dinnersOut[`${date}_${r.id}`]?.out)
                    .map(r => r.id);

                if (outPeopleNames.length > 0) {
                    setParticipants(homePeopleIds.length > 0 ? homePeopleIds : roommates.map(r => r.id));
                    setAutoExcludedNote(`💡 ${outPeopleNames.join(', ')} 登記當日不回家吃晚餐，已自動排除分攤`);
                } else {
                    setAutoExcludedNote('');
                }
            }, [date, dinnersOut, roommates]);

            // Show temporary toast message
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            // Toggle roommate dinner status
            const toggleDinnerOut = (dateStr, personId) => {
                const key = `${dateStr}_${personId}`;
                const current = dinnersOut[key];
                
                if (current && current.out) {
                    const next = { ...dinnersOut };
                    delete next[key];
                    setDinnersOut(next);
                    if (window.CloudSync) {
                        const { db, appId, doc, deleteDoc } = window.CloudSync;
                        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dinners', key));
                    }
                    showToast(`🍽️ 已標記該日在家用餐`);
                } else {
                    const payload = { out: true, note: '不回吃', ledgerCode };
                    setDinnersOut({ ...dinnersOut, [key]: payload });
                    if (window.CloudSync) {
                        const { db, appId, doc, setDoc } = window.CloudSync;
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dinners', key), payload);
                    }
                    showToast(`❌ 已標記為不回吃晚餐`);
                }
            };

            // Update roommate note for dinner absence
            const setDinnerNote = (dateStr, personId, noteVal) => {
                const key = `${dateStr}_${personId}`;
                const payload = { out: true, note: noteVal, ledgerCode };
                setDinnersOut({ ...dinnersOut, [key]: payload });
                if (window.CloudSync) {
                    const { db, appId, doc, setDoc } = window.CloudSync;
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dinners', key), payload);
                }
            };

            // Update roommate avatar emoji
            const handleSelectEmoji = (personId, emoji) => {
                const updated = roommates.map(r => r.id === personId ? { ...r, avatar: emoji } : r);
                setRoommates(updated);
                if (window.CloudSync) {
                    const { db, appId, doc, setDoc } = window.CloudSync;
                    const target = updated.find(r => r.id === personId);
                    if (target) {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'roommates', personId), target);
                    }
                }
                showToast(`✨ 已更新 ${personId} 的專屬 Emoji 圖案！`);
            };

            // Get list of available week keys
            const availableWeeks = React.useMemo(() => {
                const weeksSet = new Set(expenses.map(e => e.weekKey));
                weeksSet.add(CURRENT_WEEK_KEY);
                return Array.from(weeksSet).sort().reverse();

                const paidMap = { Janice: 0, Carrie: 0, Kingsley: 0 };
                const shareMap = { Janice: 0, Carrie: 0, Kingsley: 0 };

                weeklyExpenses.forEach(exp => {
                    const amt = parseFloat(exp.amount) || 0;
                    totalSpent += amt;

                    if (paidMap[exp.payer] !== undefined) {
                        paidMap[exp.payer] += amt;
                    }

                    if (exp.participants && exp.participants.length > 0) {
                        const perPerson = amt / exp.participants.length;
                        exp.participants.forEach(p => {
                            if (shareMap[p] !== undefined) {
                                shareMap[p] += perPerson;
                            }
                        });
                    }
                });

                const netMap = {
                    Janice: paidMap.Janice - shareMap.Janice,
                    Carrie: paidMap.Carrie - shareMap.Carrie,
                    Kingsley: paidMap.Kingsley - shareMap.Kingsley,
                };

                const debtors = [];
                const creditors = [];

                Object.keys(netMap).forEach(person => {
                    const val = netMap[person];
                    if (val < -0.01) {
                        debtors.push({ name: person, amount: Math.abs(val) });
                    } else if (val > 0.01) {
                        creditors.push({ name: person, amount: val });
                    }
                });

                const transfers = [];
                let i = 0, j = 0;

                while (i < debtors.length && j < creditors.length) {
                    const debt = debtors[i].amount;
                    const cred = creditors[j].amount;
                    const settledAmt = Math.min(debt, cred);

                    transfers.push({
                        from: debtors[i].name,
                        to: creditors[j].name,
                        amount: Math.round(settledAmt * 100) / 100
                    });

                    debtors[i].amount -= settledAmt;
                    creditors[j].amount -= settledAmt;

                    if (debtors[i].amount < 0.01) i++;
                    if (creditors[j].amount < 0.01) j++;
                }

                return { totalSpent, paidMap, shareMap, netMap, transfers };
            }, [weeklyExpenses]);

                                                    </div>

                                                    <div className="space-y-1 text-xs text-slate-500 mb-3">
                                                        <div className="flex justify-between">
                                                            <span>先付金額:</span>
                                                            <span className="font-semibold text-slate-700">£{paid.toFixed(2)}</span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span>應付份額:</span>
                                                            <span className="font-semibold text-slate-700">£{share.toFixed(2)}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                                                    <span className="text-slate-400 font-medium">結算結果:</span>
                                                    <span className={`font-bold text-sm ${net > 0.01 ? 'text-emerald-600' : net < -0.01 ? 'text-rose-600' : 'text-slate-400'}`}>
                                                        {net > 0.01 ? `+£${net.toFixed(2)}` : net < -0.01 ? `-£${Math.abs(net).toFixed(2)}` : '£0.00'}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                        </div>
                    )}

                    {/* TAB 2: ADD EXPENSE FORM */}
                    {activeTab === 'add' && (
                        <form onSubmit={handleAddExpense} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-5">
                            <h2 className="text-base font-bold text-slate-800 border-b border-slate-100 pb-3">
                                🛒 新增採購費用
                            </h2>

                            {/* Title */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                    購買品項 / 說明 <span className="text-rose-500">*</span>
                                </label>
                                <input 
                                    type="text" 
                                    placeholder="例如：高麗菜、豬肉片、牛奶..."
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    required
                                />
                            </div>

                            {/* Amount & Date */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                        總金額 (£) <span className="text-rose-500">*</span>
                                    </label>
                                    <input 
                                        type="number" 
                                        step="any"
                                        placeholder="0.00"
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                        採購日期
                                    </label>
                                    <input 
                                        type="date" 
                                        value={date}
                                        onChange={(e) => setDate(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    />
                                </div>
                            </div>

                            {/* Auto exclusion notice */}
                            {autoExcludedNote && (
                                <div className="bg-amber-50 border border-amber-200 text-amber-800 px-3.5 py-2 rounded-xl text-xs font-medium">
                                    {autoExcludedNote}
                                </div>
                            )}

                            {/* Category */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                    類別
                                </label>
                                <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                    {CATEGORIES.map(c => (
                                        <button
                                            type="button"
                                            key={c.id}
                                            onClick={() => setCategory(c.id)}
                                            className={`p-2 rounded-xl text-xs font-medium flex flex-col items-center gap-1 border transition ${category === c.id ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold' : 'border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100'}`}
                                        >
                                            <span className="text-lg">{c.emoji}</span>
                                            <span>{c.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Who Paid */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                    誰先出的錢？
                                </label>
                                <div className="grid grid-cols-3 gap-2">
                                    {roommates.map(r => (
                                        <button
                                            type="button"
                                            key={r.id}
                                            onClick={() => setPayer(r.id)}
                                            className={`p-3 rounded-xl text-xs font-semibold border flex items-center justify-center gap-2 transition ${payer === r.id ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'}`}
                                        >
                                            <span>{r.avatar}</span>
                                            <span>{r.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Who Splits */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                    參與分攤的人
                                </label>
                                <div className="grid grid-cols-3 gap-2">
                                    {roommates.map(r => {
                                        const isChecked = participants.includes(r.id);
                                        const isOutDate = dinnersOut[`${date}_${r.id}`]?.out;

                                        return (
                                            <button
                                                type="button"
                                                key={r.id}
                                                onClick={() => toggleParticipant(r.id)}
                                                className={`p-3 rounded-xl text-xs font-semibold border flex items-center justify-between transition ${isChecked ? 'bg-slate-800 border-slate-800 text-white' : 'border-slate-200 bg-slate-50 text-slate-400 hover:bg-slate-100'}`}
                                            >
                                                <span className="flex items-center gap-1.5">
                                                    <span>{r.avatar}</span>
                                                    <span>{r.name}</span>
                                                </span>
                                                <span className="flex items-center gap-1">
                                                    {isOutDate && <span className="text-[10px] bg-rose-500/20 text-rose-300 px-1 rounded">不回吃</span>}
                                                    <span>{isChecked ? '✓' : ''}</span>
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Note */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1.5">
                                    備註 (選填)
                                </label>
                                <input 
                                    type="text" 
                                    placeholder="例如：特價折扣、外食替代..."
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                />
                            </div>

                            {/* Submit Button */}
                            <button 
                                type="submit"
                                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition"
                            >
                                儲存這筆採購紀錄
                            </button>
                        </form>
                    )}

                    {/* TAB 3: DINNER ATTENDANCE REGISTER */}
                    {activeTab === 'dinners' && (
                        <div className="space-y-4">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
                                <div className="flex items-center justify-between mb-2">
                                    <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <span>🍽️ 本週晚餐不回吃登記</span>
                                    </h2>
                                    <span className="text-xs text-slate-400">點擊按鈕快速切換狀態</span>
                                </div>
                                <p className="text-xs text-slate-500 leading-relaxed mb-4">
                                    預先登記當日是否回家吃晚餐，新增採購時會**自動排除**不吃晚餐的室友，讓分攤更精準！
                                </p>

                                <div className="space-y-3">
                                    {weekDays.map(day => (
                                        <div 
                                            key={day.dateStr} 
                                            className={`p-3.5 rounded-2xl border transition ${day.isToday ? 'bg-emerald-50/50 border-emerald-200 ring-1 ring-emerald-300' : 'bg-slate-50/60 border-slate-200/80'}`}
                                        >
                                            <div className="flex items-center justify-between mb-2.5">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-slate-800">{day.dayName}</span>
                                                    <span className="text-xs text-slate-400 font-medium">{day.label}</span>
                                                    {day.isToday && (
                                                        <span className="bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                            Today
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                {roommates.map(r => {
                                                    const key = `${day.dateStr}_${r.id}`;
                                                    const item = dinnersOut[key];
                                                    const isOut = item && item.out;

                                                    return (
                                                        <div key={r.id} className="flex flex-col gap-1">
                                                            <button
                                                                type="button"
                                                                onClick={() => toggleDinnerOut(day.dateStr, r.id)}
                                                                className={`p-2.5 rounded-xl border text-xs font-semibold flex items-center justify-between transition ${isOut ? 'bg-rose-50 border-rose-300 text-rose-700 shadow-sm' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                                                            >
                                                                <span className="flex items-center gap-1.5">
                                                                    <span>{r.avatar}</span>
                                                                    <span>{r.name}</span>
                                                                </span>
                                                                <span>{isOut ? '❌ 不回吃' : '🍽️ 在家吃'}</span>
                                                            </button>

                                                            {isOut && (
                                                                <input 
                                                                    type="text"
                                                                    placeholder="外食原因 (如: 加班)"
                                                                    value={item.note || ''}
                                                                    onChange={(e) => setDinnerNote(day.dateStr, r.id, e.target.value)}
                                                                    className="bg-white border border-rose-200 text-rose-800 text-[11px] px-2 py-1 rounded-lg focus:outline-none focus:ring-1 focus:ring-rose-400"
                                                                />
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 4: TRANSACTION LIST */}
                    {activeTab === 'list' && (
                        <div className="space-y-3">
                            {weeklyExpenses.length === 0 ? (
                                <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
                                    🛒 【{selectedWeek}】尚無採購紀錄，點擊「新增採購」開始記帳吧！
                                </div>
                            ) : (
                                weeklyExpenses.map(exp => {
                                    const catObj = CATEGORIES.find(c => c.id === exp.category) || CATEGORIES[5];
                                    const payerRoommate = roommates.find(r => r.id === exp.payer) || { avatar: '👤' };

                                    return (
                                        <div key={exp.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-slate-300 transition">
                                            <div className="flex items-start gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-xl shrink-0">
                                                    {catObj.emoji}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-slate-800 text-sm">{exp.title}</div>
                                                    <div className="text-xs text-slate-400 mt-0.5 flex flex-wrap items-center gap-2">
                                                        <span>{exp.date}</span>
                                                        <span>•</span>
                                                        <span className="text-emerald-700 font-medium flex items-center gap-1">
                                                            <span>付款:</span>
                                                            <span>{payerRoommate.avatar}</span>
                                                            <span>{exp.payer}</span>
                                                        </span>
                                                        {exp.note && <span className="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">{exp.note}</span>}
                                                    </div>
                                                    <div className="text-[11px] text-slate-400 mt-1">
                                                        分攤: {exp.participants.join(', ')} (每人 £{(exp.amount / exp.participants.length).toFixed(2)})
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-0 border-slate-100">
                                                <div className="text-right">
                                                    <div className="text-lg font-bold text-slate-900">£{parseFloat(exp.amount).toFixed(2)}</div>
                                                </div>
                                                
                                                {confirmDeleteId === exp.id ? (
                                                    <div className="flex items-center gap-1">
                                                        <button 
                                                            onClick={() => handleDelete(exp.id)}
                                                            className="bg-rose-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold"
                                                        >
                                                            確認刪除
                                                        </button>
                                                        <button 
                                                            onClick={() => setConfirmDeleteId(null)}
                                                            className="bg-slate-200 text-slate-600 text-xs px-2.5 py-1.5 rounded-lg"
                                                        >
                                                            取消
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={() => setConfirmDeleteId(exp.id)}
                                                        className="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition"
                                                        title="刪除"
                                                    >
                                                        🗑️
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    )}

                    {/* Footer Info */}
                    <footer className="mt-12 text-center text-xs text-slate-400 space-y-2">
                        <p>💡 資料儲存於您的本機瀏覽器中，無須擔心外洩。</p>
                        <p>© 室友共享廚房小額採購紀錄工具 · Janice / Carrie / Kingsley</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
